        renderStats() {
            const players = this.state.currentMatch.players;
            const score = this.calculateScore();
            // Solo las acciones que cuentan para el resultado (ignora lo cargado después de terminado el partido)
            const actions = this.state.currentMatch.actions.filter(a => score.countedIds.has(a.id));

            // Puntos Totales
            const localPtsAtaque = actions.filter(a => a.team==='local' && a.fundamental.includes('ataque') && (a.outcome==='punto' || a.quality==='punto')).length;
            const localPtsBloqueo = actions.filter(a => a.team==='local' && a.fundamental==='bloqueo' && (a.outcome==='punto' || a.quality==='punto')).length;
            const localPtsSaque = actions.filter(a => a.team==='local' && a.fundamental==='saque' && (a.outcome==='punto' || a.quality==='punto')).length;
            const localPtsRivalErr = actions.filter(a => a.team==='visitor' && (a.outcome==='error' || a.quality==='error')).length;
            const totalLocalPts = localPtsAtaque + localPtsBloqueo + localPtsSaque + localPtsRivalErr;

            const visPtsMerito = actions.filter(a => a.team==='visitor' && (a.outcome==='punto' || a.quality==='punto')).length;
            const visPtsNuestroErr = actions.filter(a => a.team==='local' && (a.outcome==='error' || a.quality==='error')).length;
            const totalVisPts = visPtsMerito + visPtsNuestroErr;

            const getWidth = (val, total) => total > 0 ? Math.round((val/total)*100) : 0;
            const localAtaquePct = getWidth(localPtsAtaque, totalLocalPts);
            const localBloqueoPct = getWidth(localPtsBloqueo, totalLocalPts);
            const localSaquePct = getWidth(localPtsSaque, totalLocalPts);
            const localRivalErrPct = getWidth(localPtsRivalErr, totalLocalPts);

            const visMeritoPct = getWidth(visPtsMerito, totalVisPts);
            const visNuestroErrPct = getWidth(visPtsNuestroErr, totalVisPts);

            const recActions = actions.filter(a => a.team==='local' && a.fundamental==='recepcion');

            // 1. Eficiencia Recepción por Jugadora
            const recTableRows = players.map(p => {
                const pRecs = recActions.filter(a => a.playerId===p.id);
                if (pRecs.length === 0) return '';
                const total = pRecs.length;
                const good = pRecs.filter(a => a.quality==='#' || a.quality==='+').length;
                const bad = pRecs.filter(a => a.quality==='/' || a.quality==='error').length;
                const eff = total > 0 ? Math.round(((good - bad) / total) * 100) : 0;
                
                let effColor = 'text-green-400';
                if (eff < 20) effColor = 'text-red-400';
                else if (eff < 40) effColor = 'text-yellow-400';

                return `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-700/20 transition-colors">
                        <td class="py-2 text-left font-bold text-sm"><span class="text-blue-400 mr-2">#${p.number}</span>${this.esc(p.name)}</td>
                        <td class="py-2 text-center text-slate-300 font-semibold">${total}</td>
                        <td class="py-2 text-center text-emerald-400 font-bold">${good}</td>
                        <td class="py-2 text-center text-red-400 font-bold">${bad}</td>
                        <td class="py-2 text-center font-black ${effColor} text-lg">${eff}%</td>
                    </tr>
                `;
            }).join('');

            // 2. Eficiencia Recepción por Zonas (Dirección)
            const zones = [5, 6, 1];
            const getZoneRows = (type) => {
                const rows = zones.map(z => {
                    const subset = recActions.filter(a => (type === 'from' ? a.zoneFrom : a.zoneTo) === z);
                    if (subset.length === 0) return '';
                    const total = subset.length;
                    const good = subset.filter(a => a.quality==='#' || a.quality==='+').length;
                    const bad = subset.filter(a => a.quality==='/' || a.quality==='error').length;
                    const eff = total > 0 ? Math.round(((good - bad) / total) * 100) : 0;
                    
                    let effColor = 'text-green-400';
                    if (eff < 20) effColor = 'text-red-400';
                    else if (eff < 40) effColor = 'text-yellow-400';

                    return `
                        <tr class="border-b border-slate-700/50 hover:bg-slate-700/20 transition-colors">
                            <td class="py-2 text-center font-black text-slate-300 text-base">Z${z}</td>
                            <td class="py-2 text-center text-slate-300 font-semibold">${total}</td>
                            <td class="py-2 text-center text-emerald-400 font-bold">${good}</td>
                            <td class="py-2 text-center text-red-400 font-bold">${bad}</td>
                            <td class="py-2 text-center font-black ${effColor} text-lg">${eff}%</td>
                        </tr>
                    `;
                }).join('');
                return rows || '<tr><td colspan="5" class="text-center py-4 text-slate-500 font-semibold text-xs">Sin datos registrados en esta zona.</td></tr>';
            };

            const zoneFromRows = getZoneRows('from');
            const zoneToRows = getZoneRows('to');

            return `
                <div class="h-full flex flex-col bg-slate-900">
                    ${this.renderMatchHeader('stats')}
                    <div data-scroll="stats" class="flex-1 min-h-0 overflow-y-auto p-3 lg:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6">
                        
                        <!-- Col 1: Distribución de Puntos -->
                        <div class="w-full lg:w-1/2 flex flex-col gap-4 lg:gap-6">
                            <div class="bg-slate-800/40 rounded-3xl border border-slate-700/80 p-6 shadow-xl">
                                <h3 class="text-lg font-black text-blue-400 mb-4 uppercase tracking-widest border-b border-slate-700 pb-2">Puntos del Local (Total: ${totalLocalPts})</h3>
                                <div class="space-y-4">
                                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-slate-300">🏐 Por Ataque:</span>
                                            <span class="text-xl font-black text-white">${localPtsAtaque} <span class="text-sm text-slate-500 font-normal">(${localAtaquePct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-slate-800 rounded-full h-3"><div class="bg-blue-500 h-3 rounded-full transition-all duration-500" style="width: ${localAtaquePct}%"></div></div>
                                    </div>
                                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-slate-300">✋ Por Bloqueo:</span>
                                            <span class="text-xl font-black text-white">${localPtsBloqueo} <span class="text-sm text-slate-500 font-normal">(${localBloqueoPct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-slate-800 rounded-full h-3"><div class="bg-amber-500 h-3 rounded-full transition-all duration-500" style="width: ${localBloqueoPct}%"></div></div>
                                    </div>
                                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-slate-300">🎯 Por Saque (Aces):</span>
                                            <span class="text-xl font-black text-white">${localPtsSaque} <span class="text-sm text-slate-500 font-normal">(${localSaquePct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-slate-800 rounded-full h-3"><div class="bg-emerald-500 h-3 rounded-full transition-all duration-500" style="width: ${localSaquePct}%"></div></div>
                                    </div>
                                    <div class="bg-green-900/20 p-3 rounded-xl border border-green-700/30">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-green-400">🎁 Por Error del Rival:</span>
                                            <span class="text-xl font-black text-green-400">${localPtsRivalErr} <span class="text-sm text-green-600 font-normal">(${localRivalErrPct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-green-900/50 rounded-full h-3"><div class="bg-green-400 h-3 rounded-full transition-all duration-500" style="width: ${localRivalErrPct}%"></div></div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-slate-800/40 rounded-3xl border border-slate-700/80 p-6 shadow-xl">
                                <h3 class="text-lg font-black text-red-400 mb-4 uppercase tracking-widest border-b border-slate-700 pb-2">Puntos del Visitante (Total: ${totalVisPts})</h3>
                                <div class="space-y-4">
                                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-slate-300">🔥 Por Mérito Propio:</span>
                                            <span class="text-xl font-black text-white">${visPtsMerito} <span class="text-sm text-slate-500 font-normal">(${visMeritoPct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-slate-800 rounded-full h-3"><div class="bg-orange-500 h-3 rounded-full transition-all duration-500" style="width: ${visMeritoPct}%"></div></div>
                                    </div>
                                    <div class="bg-red-900/20 p-3 rounded-xl border border-red-700/30">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-red-400">❌ Por Errores Nuestros:</span>
                                            <span class="text-xl font-black text-red-400">${visPtsNuestroErr} <span class="text-sm text-red-600 font-normal">(${visNuestroErrPct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-red-900/50 rounded-full h-3"><div class="bg-red-500 h-3 rounded-full transition-all duration-500" style="width: ${visNuestroErrPct}%"></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Col 2: Tablas de Recepción -->
                        <div class="w-full lg:w-1/2 bg-slate-800/40 rounded-3xl border border-slate-700/80 p-4 lg:p-6 shadow-xl flex flex-col lg:overflow-hidden">
                            <div class="mb-4 shrink-0">
                                <h3 class="text-lg font-black text-white uppercase tracking-widest">Análisis de Recepción</h3>
                                <p class="text-[10px] text-slate-400 font-bold mt-1 bg-slate-900 inline-block px-2 py-1 rounded">Eficiencia = ((Excelentes [#,+]) - (Errores [/,Err])) / Total</p>
                            </div>
                            
                            <!-- Contenedor con Scroll para las 3 tablas -->
                            <div data-scroll="stats-rec" class="lg:flex-1 lg:overflow-y-auto lg:pr-2 space-y-4 lg:space-y-6">
                                
                                <!-- 1. Por Jugadora -->
                                <div class="bg-slate-900/80 rounded-2xl border border-slate-700/50 p-4">
                                    <h4 class="text-xs font-black text-blue-400 mb-2 uppercase tracking-widest border-b border-slate-700 pb-2">Por Jugadora</h4>
                                    <table class="w-full text-white text-sm">
                                        <thead>
                                            <tr class="text-slate-400 text-[10px] uppercase tracking-wider border-b border-slate-700">
                                                <th class="py-2 text-left font-black">Jugadora</th>
                                                <th class="py-2 text-center font-black">Tot</th>
                                                <th class="py-2 text-center font-black text-emerald-500">Exc</th>
                                                <th class="py-2 text-center font-black text-red-500">Err</th>
                                                <th class="py-2 text-center font-black">Efic</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${recTableRows || '<tr><td colspan="5" class="text-center py-4 text-slate-500 font-semibold text-xs">No hay datos de recepción registrados aún.</td></tr>'}
                                        </tbody>
                                    </table>
                                </div>

                                <!-- 2. Por Origen (Viene de) -->
                                <div class="bg-slate-900/80 rounded-2xl border border-slate-700/50 p-4">
                                    <h4 class="text-xs font-black text-amber-400 mb-2 uppercase tracking-widest border-b border-slate-700 pb-2">Por Origen del Saque Rival (Viene de)</h4>
                                    <table class="w-full text-white text-sm">
                                        <thead>
                                            <tr class="text-slate-400 text-[10px] uppercase tracking-wider border-b border-slate-700">
                                                <th class="py-2 text-center font-black">Zona Origen</th>
                                                <th class="py-2 text-center font-black">Tot</th>
                                                <th class="py-2 text-center font-black text-emerald-500">Exc</th>
                                                <th class="py-2 text-center font-black text-red-500">Err</th>
                                                <th class="py-2 text-center font-black">Efic</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${zoneFromRows}
                                        </tbody>
                                    </table>
                                </div>

                                <!-- 3. Por Destino (Cae en) -->
                                <div class="bg-slate-900/80 rounded-2xl border border-slate-700/50 p-4">
                                    <h4 class="text-xs font-black text-purple-400 mb-2 uppercase tracking-widest border-b border-slate-700 pb-2">Por Zona de Cobertura (Recibimos en)</h4>
                                    <table class="w-full text-white text-sm">
                                        <thead>
                                            <tr class="text-slate-400 text-[10px] uppercase tracking-wider border-b border-slate-700">
                                                <th class="py-2 text-center font-black">Zona Recepción</th>
                                                <th class="py-2 text-center font-black">Tot</th>
                                                <th class="py-2 text-center font-black text-emerald-500">Exc</th>
                                                <th class="py-2 text-center font-black text-red-500">Err</th>
                                                <th class="py-2 text-center font-black">Efic</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${zoneToRows}
                                        </tbody>
                                    </table>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            `;
        },

        renderHistory() {
            const m = this.state.currentMatch;
            
            const historyHtml = m.actions.map(a => {
                let badge = '';
                let details = '';
                let pName = 'Equipo Visitante';
                let pNumber = '🤖';
                
                if (a.team === 'local' && a.playerId) {
                    const pObj = m.players.find(p => p.id === a.playerId);
                    if (pObj) { pName = pObj.name; pNumber = pObj.number; }
                    else { pName = 'Jugadora eliminada'; pNumber = '?'; }
                }
                
                const fundName = a.fundamental.replace('_', ' ').toUpperCase();

                if (a.fundamental === 'recepcion' || (a.fundamental === 'saque' && a.zoneFrom)) {
                    if (a.fundamental === 'recepcion') {
                        const qColors = { '#':'bg-emerald-500', '+': 'bg-green-600', '!': 'bg-yellow-500', '-': 'bg-orange-500', '/': 'bg-purple-600', 'error': 'bg-red-600' };
                        const c = qColors[a.quality] || 'bg-slate-600';
                        badge = `<span class="${c} text-white px-3 py-1 rounded-lg text-sm font-black text-center inline-block min-w-[40px] shadow-md">${a.quality === 'error' ? 'ERR' : a.quality}</span>`;
                    } else { // Saque
                        const qColors = { 'punto':'bg-emerald-500', '+': 'bg-green-600', '!': 'bg-yellow-500', '-': 'bg-orange-500', '/': 'bg-purple-600', 'error': 'bg-red-600' };
                        const c = qColors[a.quality] || 'bg-slate-600';
                        badge = `<span class="${c} text-white px-3 py-1 rounded-lg text-sm font-black text-center inline-block min-w-[40px] shadow-md">${a.quality === 'error' ? 'ERR' : a.quality === 'punto' ? 'ACE' : a.quality}</span>`;
                    }
                    details = `<span class="bg-slate-900 px-2 py-1 rounded-md text-xs text-slate-300 font-bold ml-2 sm:ml-3 border border-slate-600 shadow-inner whitespace-nowrap">Zona: ${a.zoneFrom} ➔ ${a.zoneTo}</span>`;
                } else {
                    if (a.outcome === 'punto') badge = '<span class="bg-green-600 text-white px-3 py-1 rounded-lg text-sm font-black text-center inline-block shadow-md">PUNTO</span>';
                    else if (a.outcome === 'error') badge = '<span class="bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-black text-center inline-block shadow-md">ERROR</span>';
                }

const BT={alta:{l:'Pelota alta',s:'Alta',c:'var(--crimson)',d:'G4, G3, G2, G8, G9'},tendida:{l:'Pelota tendida',s:'Tendida',c:'#2F6FE4',d:'W4, W3, W2, Y8, Y7, Y9, Y0'},otra:{l:'Otras',s:'Otra',c:'#8A94A6',d:'rápidas, vendidas, segunda o sin código'}},TORD=['alta','tendida','otra'];
/* Cancha completa con 9 zonas por mitad (como DataVolley): nuestra mitad abajo, cancha contraria arriba */
function Court({R,name}){
 const X=[86.6,180,273.3],oc={4:0,3:1,2:2,7:0,8:1,9:2,5:0,6:1,1:2},rc={2:0,3:1,4:2,9:0,8:1,7:2,1:0,6:1,5:2};
 const oy=z=>[4,3,2].includes(z)?348:[7,8,9].includes(z)?440:505,dy=z=>[2,3,4].includes(z)?253:[7,8,9].includes(z)?160:67;
 const our={4:[0,0],3:[1,0],2:[2,0],7:[0,1],8:[1,1],9:[2,1],5:[0,2],6:[1,2],1:[2,2]},riv={1:[0,0],6:[1,0],5:[2,0],9:[0,1],8:[1,1],7:[2,1],2:[0,2],3:[1,2],4:[2,2]};
 const by={},rec={};
 R.forEach(r=>{const o=by[r.o]=by[r.o]||{n:0,k:0,e:0};o.n+=r.n;o.k+=r.k;o.e+=r.e;rec[r.d]=(rec[r.d]||0)+r.n;});
 const L=R.flatMap(r=>Object.entries(r.tp||{otra:{n:r.n,k:r.k,e:r.e}}).filter(([,v])=>v.n>0).map(([ty,v])=>({o:r.o,d:r.d,ty,n:v.n,k:v.k,e:v.e})));
 const pair={},pi={},ic={},tyO={};L.forEach(l=>{const k=l.o+'-'+l.d;pair[k]=(pair[k]||0)+1;(tyO[l.o]=tyO[l.o]||new Set()).add(l.ty)});
 const LL=L.map(l=>{const key=l.o+'-'+l.d,j=pi[key]=(pi[key]||0)+1,m=pair[key],k=ic[l.o]=(ic[l.o]||0)+1,tx0=X[rc[l.d]],bx=X[oc[l.o]],
   sx0=bx+(tx0<bx-1?-9:tx0>bx+1?9:(k%2?-9:9)),sy0=oy(l.o),ty0=dy(l.d),dx=tx0-sx0,dyy=ty0-sy0,len=Math.hypot(dx,dyy)||1,off=(j-(m+1)/2)*8,
   nx=-dyy/len*off,ny=dx/len*off,sx=sx0+nx,sy=sy0+ny,tx=tx0+nx,ty=ty0+ny;
   return{...l,sx,sy,ex:tx-dx/len*10,ey:ty-dyy/len*10,w:Math.min(9,1.5+l.n*.5),c:BT[l.ty].c}});
 /* cada número se ubica sobre su línea, en el primer punto libre cerca del medio */
 const placed=[];[...LL].sort((a,b)=>b.n-a.n).forEach(g=>{let best=null;for(const t of [.5,.6,.4,.7,.3,.78,.22,.85]){const x=g.sx+(g.ex-g.sx)*t,y=g.sy+(g.ey-g.sy)*t;
  if(!placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<21)){best=[x,y];break}}if(!best)best=[g.sx+(g.ex-g.sx)*.5,g.sy+(g.ey-g.sy)*.5];g.bx=best[0];g.by=best[1];placed.push(best)});
 return(
 <svg viewBox="0 0 360 600" className="w-full max-w-md mx-auto" role="img" aria-label="Cancha de vóley dividida en 9 zonas por mitad, con las direcciones de ataque según el tipo de pelota y la cantidad de pelotas">
  <defs>{TORD.map(t=><marker key={t} id={'mt-'+t} markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,1 L12,7 L0,13z" fill={BT[t].c}/></marker>)}</defs>
  <text x="180" y="13" textAnchor="middle" fontSize="11" fill="var(--muted)">Cancha contraria</text>
  {Object.keys(riv).map(z=>{const [c,r]=riv[z],x=40+c*93.3,y=20+r*93.3;return(<g key={z}>
   <rect x={x} y={y} width="93.3" height="93.3" fill="var(--mist)" stroke="var(--muted)" strokeWidth="1"/>
   <text x={x+8} y={y+18} fontSize="13" fontWeight="700" fill="var(--muted)">{z}</text>
   {rec[z]&&<text x={x+46.6} y={y+83} textAnchor="middle" fontSize="11" fill="var(--muted)">recibe {rec[z]}</text>}</g>);})}
  <text x="180" y="592" textAnchor="middle" fontSize="11" fill="var(--muted)">{name}</text>
  {Object.keys(our).map(z=>{const [c,r]=our[z],x=40+c*93.3,y=300+r*93.3,o=by[z];return(<g key={z}>
   <rect x={x} y={y} width="93.3" height="93.3" fill="var(--court)" stroke="var(--ink)" strokeWidth="1.500"/>
   <text x={x+8} y={y+18} fontSize="13" fontWeight="700" fill="var(--ink)">{z}</text>
   </g>);})}
  <line x1="28" y1="300" x2="332" y2="300" stroke="var(--crimson)" strokeWidth="5"/>
  {Object.entries(tyO).map(([o,S])=>{const T=TORD.filter(t=>S.has(t)),bx=X[oc[o]],y=oy(+o);return T.map((t,i)=>{const x=bx+(i-(T.length-1)/2)*13;return <line key={o+t} x1={x} y1={y+30} x2={x} y2={y+20} stroke={BT[t].c} strokeWidth="3.5" markerEnd={`url(#mt-${t})`}/>;});})}
  {LL.map((g,i)=><g key={i}>
   <circle cx={g.sx} cy={g.sy} r="3.500" fill={g.c}/>
   <line x1={g.sx} y1={g.sy} x2={g.ex} y2={g.ey} stroke={g.c} strokeWidth={g.w} strokeLinecap="round" markerEnd={`url(#mt-${g.ty})`} opacity=".9"/></g>)}
  {LL.map((g,i)=><g key={'b'+i}>
   <circle cx={g.bx} cy={g.by} r="10" fill="var(--paper)" stroke={g.c} strokeWidth="2"/>
   <text x={g.bx} y={g.by+4} textAnchor="middle" fontSize="11" fontWeight="700" fill="var(--ink)">{g.n}</text></g>)}
  {Object.keys(our).map(z=>{const [c,r]=our[z],x=40+c*93.3,y=300+r*93.3,o=by[z];return o?<text key={'lb'+z} x={x+46.6} y={y+86} textAnchor="middle" fontSize="11" fontWeight="600" fill="var(--ink)" style={{stroke:'var(--court)',strokeWidth:4,paintOrder:'stroke',strokeLinejoin:'round'}}>{o.n} pel. · {pc((o.k-o.e)/o.n)}%</text>:null;})}
 </svg>);}

function analyze(R){
 const tot=R.reduce((a,r)=>a+r.n,0),K=R.reduce((a,r)=>a+r.k,0),Er=R.reduce((a,r)=>a+r.e,0),g=(K-Er)/tot,by={};
 R.forEach(r=>{const o=by[r.o]=by[r.o]||{o:r.o,n:0,k:0,e:0};o.n+=r.n;o.k+=r.k;o.e+=r.e});
 const O=Object.values(by).sort((a,b)=>b.n-a.n),m=O[0],big=R.filter(r=>r.n>=3),pool=big.length>1?big:R;
 const s=[...pool].sort((a,b)=>E(b)-E(a)),best=s[0],worst=s[s.length-1],top=[...R].sort((a,b)=>b.n-a.n)[0],two=best!==worst;
 const L=[
 ['Resumen',`${tot} pelotas atacadas, ${K} kills y ${Er} errores: eficacia global de ${pc(g)}%, ${g>=.4?'alta':g>=.25?'media':'baja'}.`],
 ['Desde dónde ataca',`${pc(m.n/tot)}% de sus pelotas salen de la zona ${m.o}, con ${pc((m.k-m.e)/m.n)}% de eficacia.${O.length===1?' Depende de una sola zona de ataque, así que es predecible.':''}`],
 ['Hacia dónde ataca',`Su dirección más repetida va de la zona ${top.o} a la zona ${top.d} de la cancha contraria (${top.n} pelotas, ${pc(E(top))}% de eficacia).`]];
 if(two)L.push(['Mejor y peor dirección',`Rinde más de la zona ${best.o} a la ${best.d} (${pc(E(best))}%) y menos de la zona ${worst.o} a la ${worst.d} (${pc(E(worst))}%).`]);
 L.push(['Cómo defenderla',`Cerrar el bloqueo sobre la salida de la zona ${top.o} y ubicar la defensa de fondo en la zona ${top.d}.${two?` Se puede ceder la dirección ${worst.o} a ${worst.d}, donde es menos eficaz.`:''}`]);
 return L;}

/* Pantalla Ataque */
function AttackSection({team,p}){
 const [bt,setBt]=useState(null),[zf,setZf]=useState('all');
 const R=routes(p),A=R.length?analyze(R):[];
 const tpOf=r=>r.tp||{otra:{n:r.n,k:r.k,e:r.e}},tt={};R.forEach(r=>Object.entries(tpOf(r)).forEach(([k,v])=>{tt[k]=(tt[k]||0)+v.n}));
 const av=TORD.filter(k=>tt[k]>0),auto=[...av].sort((a,b)=>tt[b]-tt[a])[0]||'all',cb=bt&&(bt==='all'||av.includes(bt))?bt:auto;
 const RB=cb==='all'?R:R.flatMap(r=>{const v=tpOf(r)[cb];return v&&v.n?[{...r,n:v.n,k:v.k,e:v.e,tp:{[cb]:v}}]:[]});
 const zc={};RB.forEach(r=>{zc[r.o]=(zc[r.o]||0)+r.n});const ZS=[4,3,2,9,8,7,...Object.keys(zc).map(Number).filter(z=>![4,3,2,9,8,7].includes(z)).sort()];
 const cz=zf!=='all'&&zc[zf]?zf:'all',RV=cz==='all'?RB:RB.filter(r=>r.o===cz);
 const PL={alta:'Altas',tendida:'Tendidas',otra:'Otras'},nRV=RV.reduce((a,r)=>a+r.n,0);
 return(<section id="sec-ataque" className="flex flex-col gap-4 scroll-mt-4">
  <h2 className="font-display text-3xl font-bold">Ataque</h2>
  {R.length?<>
  <div className="flex flex-wrap gap-4 bg-paper border border-line rounded-xl p-4">
   <Select l="Pelota" v={cb} set={setBt} opts={[...av.map(k=>[k,`${PL[k]} (${tt[k]})`]),['all',`Todas (${R.reduce((a,r)=>a+r.n,0)})`]]}/>

     {ZS.map(z=><option key={z} value={z} disabled={!zc[z]}>Zona {z} ({zc[z]||0})</option>)}
    </select></label>
  </div>
  <div className="grid xl:grid-cols-[minmax(0,1.1fr)_minmax(0,1fr)] gap-6">
   <section className="bg-paper border border-line rounded-xl p-4">
    <p className="text-sm text-center mb-2"><span className="inline-block w-3 h-3 rounded-full mr-2 align-middle" style={{background:cb==='all'?'var(--muted)':BT[cb].c}}></span>{cb==='all'?'Todas las pelotas':cb==='otra'?'Otras pelotas (rápidas, vendidas, segunda o sin código)':`Pelotas ${PL[cb].toLowerCase()}`}{cz!=='all'?` desde la zona ${cz}`:''}: {nRV} {nRV===1?'ataque':'ataques'}</p>
    <Court key={p.id+'-'+cb+'-'+cz} R={RV} name={team.name}/>
    <div className="flex flex-wrap justify-center gap-x-5 gap-y-1 text-xs text-muted mt-3">
     {TORD.map(t=><span key={t} className="flex items-center gap-2"><span className="inline-block w-6 h-1 rounded" style={{background:BT[t].c}}></span>{BT[t].l} ({BT[t].d})</span>)}
    </div>
    <p className="text-xs text-muted text-center mt-1">Las flechas de abajo muestran qué tipos de pelota salen de cada zona. El grosor y el número de cada línea indican las pelotas por dirección y tipo de pelota. Debajo de cada zona: pelotas y eficacia = (kills − errores) / pelotas.</p>
   </section>
   <section className="bg-paper border border-line rounded-xl p-5 flex flex-col gap-4 self-start">

/* ---- Recepción según la dirección del saque ---- */
const RQ=v=>v>=.6?'#2E9E6B':v>=.4?'#8A94A6':'var(--crimson)',RQN=[['#2E9E6B','Positiva desde 60%'],['#8A94A6','40% a 59%'],['var(--crimson)','Menos de 40%']];
const recStats=L=>{const n=L.reduce((a,r)=>a+r.n,0),dp=L.reduce((a,r)=>a+r.dp,0),pp=L.reduce((a,r)=>a+r.p,0),e=L.reduce((a,r)=>a+r.e,0);return{n,dp,pp,e,pos:n?(dp+pp)/n:0,ef:n?(dp-e)/n:0}};
/* coloca cada número sobre su línea, en el primer punto libre cerca del medio */
const placeBadges=LL=>{const placed=[];[...LL].sort((a,b)=>b.n-a.n).forEach(g=>{let best=null;for(const t of [.5,.6,.4,.7,.3,.78,.22,.85]){const x=g.sx+(g.ex-g.sx)*t,y=g.sy+(g.ey-g.sy)*t;
 if(!placed.some(q=>Math.hypot(q[0]-x,q[1]-y)<21)){best=[x,y];break}}if(!best)best=[g.sx+(g.ex-g.sx)*.5,g.sy+(g.ey-g.sy)*.5];g.bx=best[0];g.by=best[1];placed.push(best)});return LL};
function RecCourt({L,name}){
 const X=[86.6,180,273.3],rivC={1:0,6:1,5:2,9:0,8:1,7:2,2:0,3:1,4:2},our={4:[0,0],3:[1,0],2:[2,0],7:[0,1],8:[1,1],9:[2,1],5:[0,2],6:[1,2],1:[2,2]},riv={1:[0,0],6:[1,0],5:[2,0],9:[0,1],8:[1,1],7:[2,1],2:[0,2],3:[1,2],4:[2,2]};

/* ---- Distribución de la armadora: rotación × recepción previa × tipo de pelota ---- */
const RQS=[['pos','Positiva','# o +'],['neu','Neutra','!'],['neg','Negativa','-']],RQA=[...RQS,['all','Todas','# + ! -']];
/* frase de la recepción elegida: "recepción positiva (# o +)" o, con Todas, "cualquier recepción (# + ! -)" */
const recTxt=q=>{const x=RQA.find(y=>y[0]===q);return q==='all'?`cualquier recepción (${x[2]})`:`recepción ${x[1].toLowerCase()} (${x[2]})`};
const BALL=[['J','Primer tiempo','J1–J5','#0E7C66'],['S','Toque de segunda','JJ / Jy','#7A4BC2'],['G','Alta','G','var(--crimson)'],['W','Tendida W','W','#2F6FE4'],['Y','Tendida Y','Y','#1B9AAA'],['X','Cruce','X','#C27A0E']];
/* Clasificación por código de combinación del ataque que sigue al armado. V2 / V3 / V4 quedan fuera; los demás códigos no listados no se asignan. */
const ballCat=c=>{c=(c||'').toUpperCase();if(!c)return'nc';if(/^J[1-5]$/.test(c))return'J';if(c==='JJ'||c==='JY')return'S';if(['V2','V3','V4'].includes(c))return'V';

/* por posición de salida (solo pelotas elegibles): cells[4|3|2|5|6|1] = {n, k (puntos #)}; noZ = sin zona en el scout */
const zoneCells=(D,r,q)=>{const c={},o={c,noZ:0};const R=D&&D.z&&D.z[r]||{};QL(q).forEach(k=>Object.entries(R[k]||{}).forEach(([code,Z])=>{const t=ballCat(code);if(t==='nc'||t==='V'||t==='otro')return;
 Object.entries(Z).forEach(([cl,v])=>{if(cl==='?'){o.noZ+=v.n;return}const x=c[cl]=c[cl]||{n:0,k:0};x.n+=v.n;x.k+=v.k})}));return o};
const distRot=(D,r,q)=>{const o={cats:{},tot:0,V:{},otro:{},nc:0};BALL.forEach(([k])=>o.cats[k]={n:0,codes:{}});o.zc=zoneCells(D,r,q);
 const R=D&&D.c&&D.c[r]||{},QS=q==='all'?['pos','neu','neg'].map(k=>R[k]||{}):[R[q]||{}];QS.forEach(Q=>Object.entries(Q).forEach(([code,n])=>{const k=ballCat(code);
  if(k==='nc')o.nc+=n;else if(k==='V'||k==='otro')o[k][code]=(o[k][code]||0)+n;else{o.cats[k].n+=n;o.cats[k].codes[code]=(o.cats[k].codes[code]||0)+n;o.tot+=n}}));return o};
const distAll=(D,q)=>{const o={cats:{},tot:0,V:{},otro:{},nc:0,zc:{c:{},noZ:0}};BALL.forEach(([k])=>o.cats[k]={n:0,codes:{}});
 [1,2,3,4,5,6].forEach(r=>{const x=distRot(D,r,q);o.tot+=x.tot;o.nc+=x.nc;o.zc.noZ+=x.zc.noZ;Object.entries(x.zc.c).forEach(([cl,v])=>{const y=o.zc.c[cl]=o.zc.c[cl]||{n:0,k:0};y.n+=v.n;y.k+=v.k});['V','otro'].forEach(t=>Object.entries(x[t]).forEach(([c,n])=>o[t][c]=(o[t][c]||0)+n));
  BALL.forEach(([k])=>{o.cats[k].n+=x.cats[k].n;Object.entries(x.cats[k].codes).forEach(([c,n])=>o.cats[k].codes[c]=(o.cats[k].codes[c]||0)+n)})});return o};
const codeList=m=>Object.entries(m).sort((a,b)=>b[1]-a[1]||(a[0]<b[0]?-1:1)).map(([c,n])=>`${c} ${n}`).join(' · ');

function distText(D,q,name){
 const A=distAll(D,q),L=[];if(!A.tot)return L;
 const top=BALL.map(([k,l])=>({k,l,n:A.cats[k].n})).sort((a,b)=>b.n-a.n)[0],cd=Object.entries(Object.assign({},...BALL.map(([k])=>A.cats[k].codes))).sort((a,b)=>b[1]-a[1])[0];
 L.push(['Resumen',`Con ${recTxt(q)}, ${name} distribuyó ${A.tot} pelotas elegibles. La categoría más usada es ${top.l} (${pc(top.n/A.tot)}%) y el código más repetido es ${cd[0]} (${cd[1]}).`]);
 const R=[1,2,3,4,5,6].map(r=>({r,o:distRot(D,r,q)})).filter(x=>x.o.tot>=5);
 if(R.length>1){const sh=x=>x.o.cats.J.n/x.o.tot,s=[...R].sort((a,b)=>sh(b)-sh(a));
  L.push(['Primer tiempo por rotación',`Usa más el primer tiempo en rotación ${s[0].r} (${pc(sh(s[0]))}%) y menos en rotación ${s[s.length-1].r} (${pc(sh(s[s.length-1]))}%). Se comparan rotaciones con al menos 5 pelotas elegibles.`])}

/* ---- Videos de YouTube con registro de aperturas ----
   Dónde se guarda: base de datos del artifact en claude.ai (capacidad db), con la cuenta de claude.ai de quien mira (capacidad user).
   - videos/yt-<id>                 enlace cargado por un editor: {yt, url, title, kids, addedAt}
   - views/<uid>                    una fila por persona que abrió algún video: {last}
   - views/<uid>/v/yt-<id>          sus aperturas de ese video: {vid, title, o:{<idEvento>: fecha ISO}, last}
   Reglas (fijadas al publicar): todos leen "videos", solo editores lo cambian; cada persona escribe y lee solo su "views/<uid>";
   los editores (administración) leen las de todos. El tiempo reproducido NO se mide: YouTube se abre en otra pestaña. */
const CL={db:null,user:null,uid:null,admin:false,ready:false,subs:new Set()};

const ytId=s=>{s=(s||'').trim();if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;let u;try{u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s)}catch(e){return null}
 const h=u.hostname.replace(/^(www|m|music)\./,''),ok=x=>x&&/^[A-Za-z0-9_-]{11}$/.test(x)?x:null;

/* Registro idempotente de una apertura: cada apertura tiene su id, así un reintento escribe el mismo dato y no suma dos veces.
   Si falla por conexión, queda en una cola de este navegador y se reintenta al volver la conexión o al abrir la app. */
const QK='sv_vq';
const qLoad=()=>{try{const v=JSON.parse(localStorage.getItem(QK));return Array.isArray(v)?v:[]}catch(e){return[]}};
const qSave=v=>{try{localStorage.setItem(QK,JSON.stringify(v.slice(-200)))}catch(e){}};
let userDocDone=false;
async function writeOpen(ev){const {db,uid}=CL;if(!db||!uid||ev.uid!==uid)return'skip';
 if(!userDocDone){await db.doc('views/'+uid).set({last:ev.at});userDocDone=true}
 const ref=db.doc(`views/${uid}/v/${ev.vid}`),body={vid:ev.vid,title:ev.title,last:ev.at,o:{[ev.id]:ev.at}};
 try{await ref.update(body)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(body);else throw e}return'ok'}
async function recordOpen(v){const {uid}=CL;if(!uid||v.kids)return'skip';const ev={id:newId(),uid,vid:v.id,title:v.title||'',at:new Date().toISOString()};
 qSave([...qLoad(),ev]);return flushQueue()}
let flushing=false;
async function flushQueue(){if(flushing||!CL.db||!CL.uid)return'skip';flushing=true;let res='ok';
 try{for(const ev of qLoad()){if(ev.uid!==CL.uid)continue;
  try{await writeOpen(ev);qSave(qLoad().filter(x=>x.id!==ev.id))}
  catch(e){const c=e&&e.code;if(c==='unavailable'||c==='resource_exhausted'||!c){res='pending';break}
   qSave(qLoad().filter(x=>x.id!==ev.id));res='denied'}}}finally{flushing=false}clNotify();return res}
try{addEventListener('online',()=>flushQueue())}catch(e){}
/* conexión con claude.ai: se resuelve después de la primera pintura */
(async()=>{try{const c=window.claude;if(!c||!c.use)throw 0;const [db,user]=await Promise.all([c.use('db'),c.use('user')]);CL.db=db;CL.user=user;
  if(user){CL.uid=await user.id();CL.admin=await user.canEdit()}}catch(e){}CL.ready=true;clNotify();flushQueue()})();

/* ---- Cuentas de la app y sus perfiles (nombre, apellido, foto y número de camiseta) ----

   (colección "accounts", solo los editores escriben) o, si la app se abre fuera de claude.ai, en este navegador.
   Las contraseñas de las cuentas nuevas se guardan como huella SHA-256, nunca en texto. */
const BUILTIN=[{id:'agr',u:'agr',p:'123',role:'Administrador'},{id:'prueba-ct',u:'prueba',p:'ct',role:'Cuerpo Técnico'},{id:'prueba-j',u:'prueba',p:'j',role:'Jugador'}];

const AC={docs:{},ready:false,subs:new Set(),src:'local'};
const acNotify=()=>AC.subs.forEach(f=>f());
const acLocal=()=>{try{const v=JSON.parse(localStorage.getItem('sv_accounts'));return v&&typeof v==='object'?v:{}}catch(e){return{}}};
let acUnsub=null;
const acStart=()=>{if(CL.db&&!acUnsub){AC.src='db';acUnsub=CL.db.collection('accounts').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());AC.docs=o;AC.ready=true;acNotify()},()=>{AC.ready=true;acNotify()})}

function useAccounts(){const [,f]=useState(0);useEffect(()=>{const h=()=>f(x=>x+1);AC.subs.add(h);if(CL.ready)acStart();return()=>AC.subs.delete(h)},[]);

const sha=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const passHash=(id,p)=>sha('sv|'+id+'|'+p);

const readPhoto=file=>new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error('tipo'));const r=new FileReader();r.onerror=()=>rej(new Error('lectura'));
 r.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('imagen'));img.onload=()=>{const S=160,c=document.createElement('canvas');c.width=c.height=S;const k=Math.min(img.width,img.height);
  c.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,S,S);res(c.toDataURL('image/jpeg',.82))};img.src=r.result};r.readAsDataURL(file)});

/* Ventana Análisis Rival */
const rivalMatches=t=>TEAMS[t-1].real?TEAMS[t-1].real.matches.length:3+Math.floor(rnd(t*53)*4);
const fac=(t,n)=>TEAMS[t-1].real?1:n/rivalMatches(t);
const inclInfo=(t,off)=>{const R=TEAMS[t-1].real,cur=(off&&off[t])||[];if(R)return{M:R.matches.length,n:R.matches.filter(m=>!cur.includes(m.key)).length};const M=rivalMatches(t);return{M,n:M-cur.filter(x=>typeof x==='number').length}};
const rivalTiles=(t,n)=>{if(TEAMS[t-1].real)return realTiles(t,n);const S=teamSummary(t),g=x=>S.find(y=>y.n===x),r=k=>rnd(t*41+k),M=rivalMatches(t),f=n/M,
 sq=g('Saque'),at=g('Ataque'),bl=g('Bloqueo'),df=g('Defensa'),rc=g('Recepción'),q=v=>Math.round(v*f);
 return[
 {l:'Partidos seleccionados',v:String(n),d:`de ${M} disponibles`},
 {l:'Saque',v:sq.ef+'%',d:`${q(sq.p)} aces · ${Math.round(sq.e/sq.a*100)}% error`,sg:true},
 {l:'Recepción',v:Math.round(45+r(1)*25)+'%',d:`${q(rc.a)} recepciones`},
 {l:'Ataque',v:at.ef+'%',d:`${q(at.a)} ataques · ${Math.round(at.p/at.a*100)}% kill`,sg:true},
 {l:'Bloqueo',v:String(q(bl.p)),d:'puntos de bloqueo'},
 {l:'Defensa',v:Math.round(50+r(2)*25)+'%',d:`${q(df.a)} defensas`}];};
/* Cuadrantes: desde dónde atacan y a dónde arma el armador (seis zonas) */
const rivalGrid=t=>{
 const L=TEAMS[t-1].players.flatMap(p=>routes(p).map(r=>({...r,pos:p.pos,z:({7:5,8:6,9:1})[r.o]||r.o})));
 const agg=A=>{const m={},tot=A.reduce((a,r)=>a+r.n,0);A.forEach(r=>{const o=m[r.z]=m[r.z]||{n:0,k:0,e:0};o.n+=r.n;o.k+=r.k;o.e+=r.e});
  return Object.fromEntries(Object.entries(m).map(([z,o])=>[z,{sh:o.n/tot,ef:(o.k-o.e)/o.n}]))};

/* Lectura de archivos de scout: se leen en el navegador, no se envían a ningún servidor */
const PTS=new Set(['Saque','Ataque','Bloqueo']);
const SUMORD=['Saque','Ataque','Bloqueo','Colocación','Recepción','Defensa'],sortSum=a=>[...a].sort((x,y)=>SUMORD.indexOf(x.n)-SUMORD.indexOf(y.n));
const SK={S:'Saque',R:'Recepción',A:'Ataque',E:'Colocación',B:'Bloqueo',D:'Defensa'},DL={';':'punto y coma','\t':'tabulación',',':'coma'};
const fmtKB=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const decodeTxt=buf=>{let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}return t.replace(/^﻿/,'')};
const PARSER_V=6;
const tc=s=>s&&s===s.toUpperCase()?s.toLowerCase().replace(/(^|[\s\-'])(\S)/g,(m,a,b)=>a+b.toUpperCase()):(s||'');
const longTxt=c=>c.filter(x=>/[A-Za-zÁÉÍÓÚáéíóúÑñ]/.test(x)).sort((a,b)=>b.trim().length-a.trim().length)[0]||'';
const parseDvw=text=>{
 const sec={};let cur=null;
 text.split(/\r?\n/).forEach(l=>{const m=l.match(/^\[(3[A-Z0-9\-]+)\]/);if(m){cur=m[1];sec[cur]=[]}else if(cur&&l.trim())sec[cur].push(l)});
 if(!sec['3SCOUT']&&!sec['3TEAMS'])return{ok:false,msg:'No encuentro las secciones de un archivo de DataVolley (como [3TEAMS] o [3SCOUT]). Revisa que sea un .dvw.'};
 const f=l=>l.split(';'),T=(sec['3TEAMS']||[]).slice(0,2).map(l=>{const c=f(l);return{code:c[0],name:(c[1]||'').trim()||c[0]}});
 const P=[[],[]];
 ['3PLAYERS-H','3PLAYERS-V'].forEach((k,i)=>(sec[k]||[]).forEach(l=>{const c=f(l);if(c[1]&&c[1].trim())P[i].push({n:c[1].trim(),last:(c[9]||'').trim(),first:(c[10]||'').trim()})}));
 const defs={},calls={};
 (sec['3ATTACKCOMBINATION']||[]).forEach(l=>{const c=f(l),k=(c[0]||'').trim();if(k)defs[k]={z:/^[1-9]$/.test((c[1]||'').trim())?+c[1].trim():null,d:longTxt(c.slice(2)).trim()}});
 (sec['3SETTERCALL']||[]).forEach(l=>{const c=f(l),k=(c[0]||'').trim();if(k)calls[k]=longTxt(c.slice(1)).trim()});
 const st=[{},{}],acts=[],zr=[null,null],ZC=[0,0],spn=[null,null],SET=[new Set(),new Set()];let tot=0,set=1,za=0,nA=0;
 const zn=ch=>/^[1-9]$/.test(ch||'')?+ch:null;
 (sec['3SCOUT']||[]).forEach(l=>{
  if(/^\*\*\d+set/i.test(l)){set++;return}
  const zl=l.match(/^(\*?a|\*)[zZ]([1-6])(?!\d)/);if(zl){const sd=zl[1].includes('a')?1:0;zr[sd]=+zl[2];ZC[sd]++;return}
  const pl=l.match(/^(\*?a|\*)P(\d{1,2})(?!\d)/);if(pl){const sd=pl[1].includes('a')?1:0;spn[sd]=+pl[2];SET[sd].add(+pl[2]);return}
  const F=l.split(';'),m=F[0].match(/^([*a])(\d{2})([SREABDF])(.)([#+!\-\/=])(.*)$/);if(!m)return;
  const rot=[zr[0],zr[1]];
  /* Cada línea de acción del .dvw trae, después de la hora (hh.mm.ss): set, posición de la armadora local, posición de la armadora visitante,
     datos de video y al final las 12 jugadoras en cancha (posiciones 1-6 del local y 1-6 del visitante). Se guardan para reconstruir la rotación. */
  const ti=F.findIndex((x,i)=>i>0&&/^\d{1,2}[.:]\d{2}[.:]\d{2}$/.test(x.trim()));let fr=null,lu=null;
  if(ti>0){const v=i=>{const n=parseInt(F[ti+i],10);return n>=1&&n<=6?n:null};fr=[v(2),v(3)];
   const nums=F.slice(ti+4).map(x=>x.trim()).filter(x=>/^\d{1,2}$/.test(x)).map(Number);if(nums.length>=12){const t12=nums.slice(-12);lu=[t12.slice(0,6),t12.slice(6)]}}
  const s=m[1]==='*'?0:1,rest=m[6]||'',cd=rest.slice(0,2),
   a={s,n:+m[2],k:m[3],t:m[4],e:m[5],c:/^[A-Za-z0-9]{2}$/.test(cd)?cd:'',st:zn(rest[3]),en:zn(rest[4]),set,rot,fr,lu,sp:[spn[0],spn[1]]};
  acts.push(a);tot++;
  const x=st[s][a.k]=st[s][a.k]||{n:0,'#':0,'+':0,'!':0,'-':0,'/':0,'=':0};x.n++;x[a.e]++;
  if(a.k==='A'){nA++;if(a.st&&a.en)za++}});
 const M=f((sec['3MATCH']||[''])[0]);
 return{ok:true,v:PARSER_V,zc:ZC,setters:[[...SET[0]],[...SET[1]]],teams:T,players:P,st,tot,acts,defs,calls,za,nA,date:(M[0]||'').trim(),league:(M[3]||'').trim()};};
const tableInfo=(H,rows,d)=>{
 const syn={Equipo:['equipo','team'],Jugadora:['jugadora','jugador','player','nombre','name'],Fundamento:['fundamento','habilidad','skill','accion','acción'],'Zona de origen':['origen','zona origen','start zone','zona inicio'],'Zona de destino':['destino','zona destino','end zone','zona fin'],Resultado:['resultado','evaluacion','evaluación','eval','result','eficacia']};
 return{ok:true,d,H,n:rows.length,preview:rows.slice(0,5),found:Object.entries(syn).map(([k,v])=>[k,H.find(h=>v.some(x=>h.toLowerCase().includes(x)))||null])};};
const parseTable=text=>{
 const L=text.split(/\r?\n/).filter(l=>l.trim());if(L.length<2)return{ok:false,msg:'El archivo tiene menos de dos filas, así que no hay una tabla para leer.'};
 const cnt=d=>L[0].split(d).length,d=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0],cl=x=>x.replace(/^"|"$/g,'').trim();

const parseJson=text=>{
 let j;try{j=JSON.parse(text)}catch(e){return{ok:false,msg:'El archivo no es un JSON válido.'}}
 const A=Array.isArray(j)?j:Object.values(j||{}).find(Array.isArray);
 if(!A||!A.length||typeof A[0]!=='object'||!A[0])return{ok:false,msg:'Es un JSON, pero no encuentro una lista de registros (filas con campos).'};
 const H=Object.keys(A[0]);return tableInfo(H,A.map(o=>H.map(h=>String((o&&o[h])??''))),null);};
const readScout=async f=>{
 const base={key:`${f.name}|${f.size}|${f.lastModified}`,name:f.name,size:f.size},ext=(f.name.split('.').pop()||'').toLowerCase();

  if(f.size>25*1024*1024)return{...base,kind:'error',msg:'El archivo pesa más de 25 MB.'};
  if(ext==='dvw'){const txt=decodeTxt(await f.arrayBuffer());let raw=true;try{localStorage.setItem('sv_raw_'+base.key,txt)}catch(e){raw=false;SAVE_ERR=true}return{...base,kind:'dvw',raw,r:parseDvw(txt)}}
  if(['csv','tsv','txt'].includes(ext))return{...base,kind:'tabla',r:parseTable(decodeTxt(await f.arrayBuffer()))};
  if(ext==='json')return{...base,kind:'tabla',r:parseJson(decodeTxt(await f.arrayBuffer()))};
  return{...base,kind:'otro'};
 }catch(e){return{...base,kind:'error',msg:'No se pudo abrir el archivo.'}}};

function ScoutFiles({files,setFiles}){
 const [busy,setBusy]=useState(false),[over,setOver]=useState(false);
 const add=async list=>{const arr=Array.from(list||[]);if(!arr.length)return;setBusy(true);
  const out=[];for(const f of arr)out.push(await readScout(f));

  setFiles(prev=>{const same=(a,b)=>a.key===b.key||(a.name===b.name&&a.size===b.size);let res=prev.map(x=>{const n=out.find(y=>same(x,y));if(n&&n.key!==x.key){try{localStorage.removeItem('sv_raw_'+x.key)}catch(e){}}return n||x});
   out.forEach(y=>{if(!res.some(x=>x.key===y.key))res.push(y)});return res});
  setBusy(false)};
 return(<Card t="Archivos de scout">
  <label onDragOver={e=>{e.preventDefault();setOver(true)}} onDragLeave={()=>setOver(false)} onDrop={e=>{e.preventDefault();setOver(false);add(e.dataTransfer.files)}}
   className={`flex flex-col items-center gap-2 rounded-xl border-2 border-dashed px-6 py-8 text-center cursor-pointer focus-within:outline focus-within:outline-2 focus-within:outline-crimson ${over?'border-crimson bg-mist':'border-line'}`}>

function AliasCard({aliases,setAliases}){
