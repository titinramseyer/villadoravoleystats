                        <div class="lg:w-[30%] shrink-0 lg:shrink flex flex-col bg-slate-800/40 backdrop-blur rounded-3xl border border-slate-700/80 p-2.5 lg:p-3 shadow-xl lg:min-h-0">
                            <div class="flex bg-slate-900/90 rounded-2xl p-1 lg:p-1.5 mb-2 lg:mb-3 border border-slate-700/50 shrink-0">
                                <button onclick="app.setTeam('local')" class="flex-1 py-2.5 lg:py-3 font-black text-xs lg:text-sm uppercase tracking-wider rounded-xl transition-all ${isLocal ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">Mi Equipo</button>
                                <button onclick="app.setTeam('visitor')" class="flex-1 py-2.5 lg:py-3 font-black text-xs lg:text-sm uppercase tracking-wider rounded-xl transition-all ${isVisitor ? 'bg-red-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">Visitante</button>
                            </div>
                            <div data-scroll="players" class="lg:flex-1 lg:overflow-y-auto lg:pr-1">
                                <div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-2 gap-1.5 lg:gap-2">
                                    ${playersHtml}
                                </div>
                            </div>
                        </div>

                        <!-- Col 2: Fundamentos -->
                        <div class="lg:w-[25%] shrink-0 lg:shrink flex flex-col bg-slate-800/40 backdrop-blur rounded-3xl border border-slate-700/80 p-2.5 lg:p-3 shadow-xl">
                            <span class="hidden lg:block text-xs text-slate-400 uppercase tracking-widest font-black mb-3 mt-1 text-center shrink-0">Fundamento</span>
                            <div class="grid grid-cols-4 lg:flex lg:flex-col gap-1.5 lg:gap-2.5 lg:flex-1 lg:justify-center">
                                ${fundHtml}
                            </div>
                        </div>

                        <!-- Col 3: Resultados -->
                        <div id="result-panel" class="lg:w-[45%] shrink-0 lg:shrink min-h-[230px] lg:min-h-0 flex flex-col bg-slate-800/40 backdrop-blur rounded-3xl border border-slate-700/80 p-3 lg:p-4 shadow-xl relative">
                            ${!playerSelected || !fundamentalSelected ? 
                                `<div class="absolute inset-0 z-10 flex items-center justify-center p-6 text-center bg-slate-900/70 backdrop-blur-sm rounded-3xl border border-slate-700">
                                    <p class="text-slate-300 font-bold text-base lg:text-xl tracking-wide uppercase"><span class="text-blue-400">1.</span> Selecciona Jugadora<br class="hidden lg:block"><span class="lg:hidden"> · </span><br class="hidden lg:block"><span class="text-blue-400">2.</span> Selecciona Fundamento</p>
                                </div>` : ''}
                            ${rightColHtml}
                        </div>
                    </div>
                </div>
            `;
        },

        renderStats() {
            const players = this.state.currentMatch.players;
            const score = this.calculateScore();
            // Solo las acciones que cuentan para el resultado (ignora lo cargado después de terminado el partido)
            const actions = this.state.currentMatch.actions.filter(a => score.countedIds.has(a.id));

            // Puntos Totales
            const localPtsAtaque = actions.filter(a => a.team==='local' && a.fundamental.includes('ataque') && (a.outcome==='punto' || a.quality==='punto')).length;
            const localPtsBloqueo = actions.filter(a => a.team==='local' && a.fundamental==='bloqueo' && (a.outcome==='punto' || a.quality==='punto')).length;
            const localPtsSaque = actions.filter(a => a.team==='local' && a.fundamental==='saque' && (a.outcome==='punto' || a.quality==='punto')).length;
            const localPtsRivalErr = actions.filter(a => a.team==='visitor' && (a.outcome==='error' || a.quality==='error')).length;
            const totalLocalPts = localPtsAtaque + localPtsBloqueo + localPtsSaque + localPtsRivalErr;

            const visPtsMerito = actions.filter(a => a.team==='visitor' && (a.outcome==='punto' || a.quality==='punto')).length;
            const visPtsNuestroErr = actions.filter(a => a.team==='local' && (a.outcome==='error' || a.quality==='error')).length;
            const totalVisPts = visPtsMerito + visPtsNuestroErr;

            const getWidth = (val, total) => total > 0 ? Math.round((val/total)*100) : 0;
            const localAtaquePct = getWidth(localPtsAtaque, totalLocalPts);
            const localBloqueoPct = getWidth(localPtsBloqueo, totalLocalPts);
            const localSaquePct = getWidth(localPtsSaque, totalLocalPts);
            const localRivalErrPct = getWidth(localPtsRivalErr, totalLocalPts);

            const visMeritoPct = getWidth(visPtsMerito, totalVisPts);
            const visNuestroErrPct = getWidth(visPtsNuestroErr, totalVisPts);

            const recActions = actions.filter(a => a.team==='local' && a.fundamental==='recepcion');

            // 1. Eficiencia Recepción por Jugadora
            const recTableRows = players.map(p => {
                const pRecs = recActions.filter(a => a.playerId===p.id);
                if (pRecs.length === 0) return '';
                const total = pRecs.length;
                const good = pRecs.filter(a => a.quality==='#' || a.quality==='+').length;
                const bad = pRecs.filter(a => a.quality==='/' || a.quality==='error').length;
                const eff = total > 0 ? Math.round(((good - bad) / total) * 100) : 0;
                
                let effColor = 'text-green-400';
                if (eff < 20) effColor = 'text-red-400';
                else if (eff < 40) effColor = 'text-yellow-400';

                return `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-700/20 transition-colors">
                        <td class="py-2 text-left font-bold text-sm"><span class="text-blue-400 mr-2">#${p.number}</span>${this.esc(p.name)}</td>
                        <td class="py-2 text-center text-slate-300 font-semibold">${total}</td>
                        <td class="py-2 text-center text-emerald-400 font-bold">${good}</td>
                        <td class="py-2 text-center text-red-400 font-bold">${bad}</td>
                        <td class="py-2 text-center font-black ${effColor} text-lg">${eff}%</td>
                    </tr>
                `;
            }).join('');

            // 2. Eficiencia Recepción por Zonas (Dirección)
            const zones = [5, 6, 1];
            const getZoneRows = (type) => {
                const rows = zones.map(z => {
                    const subset = recActions.filter(a => (type === 'from' ? a.zoneFrom : a.zoneTo) === z);
                    if (subset.length === 0) return '';
                    const total = subset.length;
                    const good = subset.filter(a => a.quality==='#' || a.quality==='+').length;
                    const bad = subset.filter(a => a.quality==='/' || a.quality==='error').length;
                    const eff = total > 0 ? Math.round(((good - bad) / total) * 100) : 0;
                    
                    let effColor = 'text-green-400';
                    if (eff < 20) effColor = 'text-red-400';
                    else if (eff < 40) effColor = 'text-yellow-400';

                    return `
                        <tr class="border-b border-slate-700/50 hover:bg-slate-700/20 transition-colors">
                            <td class="py-2 text-center font-black text-slate-300 text-base">Z${z}</td>
                            <td class="py-2 text-center text-slate-300 font-semibold">${total}</td>
                            <td class="py-2 text-center text-emerald-400 font-bold">${good}</td>
                            <td class="py-2 text-center text-red-400 font-bold">${bad}</td>
                            <td class="py-2 text-center font-black ${effColor} text-lg">${eff}%</td>
                        </tr>
                    `;
                }).join('');
                return rows || '<tr><td colspan="5" class="text-center py-4 text-slate-500 font-semibold text-xs">Sin datos registrados en esta zona.</td></tr>';
            };

            const zoneFromRows = getZoneRows('from');
            const zoneToRows = getZoneRows('to');

            return `
                <div class="h-full flex flex-col bg-slate-900">
                    ${this.renderMatchHeader('stats')}
                    <div data-scroll="stats" class="flex-1 min-h-0 overflow-y-auto p-3 lg:p-6 flex flex-col lg:flex-row gap-4 lg:gap-6">
                        
                        <!-- Col 1: Distribución de Puntos -->
                        <div class="w-full lg:w-1/2 flex flex-col gap-4 lg:gap-6">
                            <div class="bg-slate-800/40 rounded-3xl border border-slate-700/80 p-6 shadow-xl">
                                <h3 class="text-lg font-black text-blue-400 mb-4 uppercase tracking-widest border-b border-slate-700 pb-2">Puntos del Local (Total: ${totalLocalPts})</h3>
                                <div class="space-y-4">
                                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-slate-300">🏐 Por Ataque:</span>
                                            <span class="text-xl font-black text-white">${localPtsAtaque} <span class="text-sm text-slate-500 font-normal">(${localAtaquePct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-slate-800 rounded-full h-3"><div class="bg-blue-500 h-3 rounded-full transition-all duration-500" style="width: ${localAtaquePct}%"></div></div>
                                    </div>
                                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-slate-300">✋ Por Bloqueo:</span>
                                            <span class="text-xl font-black text-white">${localPtsBloqueo} <span class="text-sm text-slate-500 font-normal">(${localBloqueoPct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-slate-800 rounded-full h-3"><div class="bg-amber-500 h-3 rounded-full transition-all duration-500" style="width: ${localBloqueoPct}%"></div></div>
                                    </div>
                                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-slate-300">🎯 Por Saque (Aces):</span>
                                            <span class="text-xl font-black text-white">${localPtsSaque} <span class="text-sm text-slate-500 font-normal">(${localSaquePct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-slate-800 rounded-full h-3"><div class="bg-emerald-500 h-3 rounded-full transition-all duration-500" style="width: ${localSaquePct}%"></div></div>
                                    </div>
                                    <div class="bg-green-900/20 p-3 rounded-xl border border-green-700/30">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-green-400">🎁 Por Error del Rival:</span>
                                            <span class="text-xl font-black text-green-400">${localPtsRivalErr} <span class="text-sm text-green-600 font-normal">(${localRivalErrPct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-green-900/50 rounded-full h-3"><div class="bg-green-400 h-3 rounded-full transition-all duration-500" style="width: ${localRivalErrPct}%"></div></div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-slate-800/40 rounded-3xl border border-slate-700/80 p-6 shadow-xl">
                                <h3 class="text-lg font-black text-red-400 mb-4 uppercase tracking-widest border-b border-slate-700 pb-2">Puntos del Visitante (Total: ${totalVisPts})</h3>
                                <div class="space-y-4">
                                    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-slate-300">🔥 Por Mérito Propio:</span>
                                            <span class="text-xl font-black text-white">${visPtsMerito} <span class="text-sm text-slate-500 font-normal">(${visMeritoPct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-slate-800 rounded-full h-3"><div class="bg-orange-500 h-3 rounded-full transition-all duration-500" style="width: ${visMeritoPct}%"></div></div>
                                    </div>
                                    <div class="bg-red-900/20 p-3 rounded-xl border border-red-700/30">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="font-bold text-red-400">❌ Por Errores Nuestros:</span>
                                            <span class="text-xl font-black text-red-400">${visPtsNuestroErr} <span class="text-sm text-red-600 font-normal">(${visNuestroErrPct}%)</span></span>
                                        </div>
                                        <div class="w-full bg-red-900/50 rounded-full h-3"><div class="bg-red-500 h-3 rounded-full transition-all duration-500" style="width: ${visNuestroErrPct}%"></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Col 2: Tablas de Recepción -->
                        <div class="w-full lg:w-1/2 bg-slate-800/40 rounded-3xl border border-slate-700/80 p-4 lg:p-6 shadow-xl flex flex-col lg:overflow-hidden">
                            <div class="mb-4 shrink-0">
                                <h3 class="text-lg font-black text-white uppercase tracking-widest">Análisis de Recepción</h3>
                                <p class="text-[10px] text-slate-400 font-bold mt-1 bg-slate-900 inline-block px-2 py-1 rounded">Eficiencia = ((Excelentes [#,+]) - (Errores [/,Err])) / Total</p>
                            </div>
                            
                            <!-- Contenedor con Scroll para las 3 tablas -->
                            <div data-scroll="stats-rec" class="lg:flex-1 lg:overflow-y-auto lg:pr-2 space-y-4 lg:space-y-6">
                                
                                <!-- 1. Por Jugadora -->
                                <div class="bg-slate-900/80 rounded-2xl border border-slate-700/50 p-4">
                                    <h4 class="text-xs font-black text-blue-400 mb-2 uppercase tracking-widest border-b border-slate-700 pb-2">Por Jugadora</h4>
                                    <table class="w-full text-white text-sm">
                                        <thead>
                                            <tr class="text-slate-400 text-[10px] uppercase tracking-wider border-b border-slate-700">
                                                <th class="py-2 text-left font-black">Jugadora</th>
                                                <th class="py-2 text-center font-black">Tot</th>
                                                <th class="py-2 text-center font-black text-emerald-500">Exc</th>
                                                <th class="py-2 text-center font-black text-red-500">Err</th>
                                                <th class="py-2 text-center font-black">Efic</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${recTableRows || '<tr><td colspan="5" class="text-center py-4 text-slate-500 font-semibold text-xs">No hay datos de recepción registrados aún.</td></tr>'}
                                        </tbody>
                                    </table>
                                </div>

                                <!-- 2. Por Origen (Viene de) -->
                                <div class="bg-slate-900/80 rounded-2xl border border-slate-700/50 p-4">
                                    <h4 class="text-xs font-black text-amber-400 mb-2 uppercase tracking-widest border-b border-slate-700 pb-2">Por Origen del Saque Rival (Viene de)</h4>
                                    <table class="w-full text-white text-sm">
                                        <thead>
                                            <tr class="text-slate-400 text-[10px] uppercase tracking-wider border-b border-slate-700">
                                                <th class="py-2 text-center font-black">Zona Origen</th>
                                                <th class="py-2 text-center font-black">Tot</th>
                                                <th class="py-2 text-center font-black text-emerald-500">Exc</th>
                                                <th class="py-2 text-center font-black text-red-500">Err</th>
                                                <th class="py-2 text-center font-black">Efic</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${zoneFromRows}
                                        </tbody>
                                    </table>
                                </div>

                                <!-- 3. Por Destino (Cae en) -->
                                <div class="bg-slate-900/80 rounded-2xl border border-slate-700/50 p-4">
                                    <h4 class="text-xs font-black text-purple-400 mb-2 uppercase tracking-widest border-b border-slate-700 pb-2">Por Zona de Cobertura (Recibimos en)</h4>
                                    <table class="w-full text-white text-sm">
                                        <thead>
                                            <tr class="text-slate-400 text-[10px] uppercase tracking-wider border-b border-slate-700">
                                                <th class="py-2 text-center font-black">Zona Recepción</th>
                                                <th class="py-2 text-center font-black">Tot</th>
                                                <th class="py-2 text-center font-black text-emerald-500">Exc</th>
                                                <th class="py-2 text-center font-black text-red-500">Err</th>
                                                <th class="py-2 text-center font-black">Efic</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${zoneToRows}
                                        </tbody>
                                    </table>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            `;
        },

        renderHistory() {
            const m = this.state.currentMatch;
            
            const historyHtml = m.actions.map(a => {
                let badge = '';
                let details = '';
                let pName = 'Equipo Visitante';
                let pNumber = '🤖';
                
                if (a.team === 'local' && a.playerId) {
                    const pObj = m.players.find(p => p.id === a.playerId);
                    if (pObj) { pName = pObj.name; pNumber = pObj.number; }
                    else { pName = 'Jugadora eliminada'; pNumber = '?'; }
                }
                
                const fundName = a.fundamental.replace('_', ' ').toUpperCase();

                if (a.fundamental === 'recepcion' || (a.fundamental === 'saque' && a.zoneFrom)) {
                    if (a.fundamental === 'recepcion') {
                        const qColors = { '#':'bg-emerald-500', '+': 'bg-green-600', '!': 'bg-yellow-500', '-': 'bg-orange-500', '/': 'bg-purple-600', 'error': 'bg-red-600' };
                        const c = qColors[a.quality] || 'bg-slate-600';
                        badge = `<span class="${c} text-white px-3 py-1 rounded-lg text-sm font-black text-center inline-block min-w-[40px] shadow-md">${a.quality === 'error' ? 'ERR' : a.quality}</span>`;
                    } else { // Saque
                        const qColors = { 'punto':'bg-emerald-500', '+': 'bg-green-600', '!': 'bg-yellow-500', '-': 'bg-orange-500', '/': 'bg-purple-600', 'error': 'bg-red-600' };
                        const c = qColors[a.quality] || 'bg-slate-600';
                        badge = `<span class="${c} text-white px-3 py-1 rounded-lg text-sm font-black text-center inline-block min-w-[40px] shadow-md">${a.quality === 'error' ? 'ERR' : a.quality === 'punto' ? 'ACE' : a.quality}</span>`;
                    }
                    details = `<span class="bg-slate-900 px-2 py-1 rounded-md text-xs text-slate-300 font-bold ml-2 sm:ml-3 border border-slate-600 shadow-inner whitespace-nowrap">Zona: ${a.zoneFrom} ➔ ${a.zoneTo}</span>`;
                } else {
                    if (a.outcome === 'punto') badge = '<span class="bg-green-600 text-white px-3 py-1 rounded-lg text-sm font-black text-center inline-block shadow-md">PUNTO</span>';
                    else if (a.outcome === 'error') badge = '<span class="bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-black text-center inline-block shadow-md">ERROR</span>';
                }

                const teamColor = a.team === 'local' ? 'border-l-4 border-blue-500' : 'border-l-4 border-red-500';

                return `
                    <div class="bg-slate-800/80 p-3 sm:p-4 rounded-2xl flex justify-between items-center gap-2 border border-slate-700/50 mb-2 sm:mb-3 shadow-lg ${teamColor}">
                        <div class="flex items-center flex-wrap gap-x-3 sm:gap-x-4 gap-y-2 min-w-0">
                            <div class="w-10 h-10 sm:w-12 sm:h-12 shrink-0 bg-slate-900 rounded-full flex items-center justify-center font-black text-lg sm:text-xl text-slate-300 border border-slate-700">${pNumber}</div>
                            <div class="w-28 sm:w-40 min-w-0">
                                <div class="font-black text-sm text-white truncate">${this.esc(pName)}</div>
                                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${a.team === 'local' ? 'Local' : 'Visitante'}</div>
                            </div>
                            <div class="sm:w-32 font-black text-blue-300 uppercase tracking-wide text-xs sm:text-sm">${fundName}</div>
                            <div class="flex items-center flex-wrap gap-y-1">
                                ${badge}
                                ${details}
                            </div>
                        </div>
                        ${this.canWrite() ? `<button onclick="app.deleteAction(${a.id})" title="Borrar acción" class="shrink-0 text-slate-500 hover:text-red-400 p-3 bg-slate-900/50 hover:bg-slate-900 rounded-xl btn-press font-bold text-xs uppercase flex items-center gap-2 border border-slate-700">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            <span class="hidden sm:inline">Borrar Acción</span>
                        </button>` : ''}
                    </div>
                `;
            }).join('') || '<div class="text-center w-full text-slate-500 text-lg py-20 font-bold uppercase tracking-wider flex flex-col items-center gap-4"><span class="text-6xl">👻</span> Historial vacío</div>';

            return `
                <div class="h-full flex flex-col bg-slate-900">
                    ${this.renderMatchHeader('history')}
                    <div class="flex-1 min-h-0 p-3 sm:p-6 flex flex-col items-center overflow-hidden">
                        <div data-scroll="history" class="w-full max-w-4xl flex-1 overflow-y-auto pr-1 sm:pr-4 pb-10">
                            ${historyHtml}
                        </div>
                    </div>
                </div>
            `;
        },

        render() {
            const root = document.getElementById('app');
            if (!this.isLogged()) {
                root.innerHTML = this.renderLogin();
                const u = document.getElementById('login-user');
                if (u) u.focus();
                return;
            }
            if (this.state.view !== 'home' && !this.state.currentMatch) this.state.view = 'home';
            if (!this.canWrite() && (this.state.view === 'tracker' || this.state.view === 'setup')) this.state.view = this.state.currentMatch ? 'stats' : 'home';
            this.save();
            // Conservar la posición de scroll de cada panel entre redibujos (en el celular, cada toque redibuja)
            const sameView = this._lastView === this.state.view;
            const scrolls = {};
            if (sameView) root.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });
            this._lastView = this.state.view;
            if (this.state.view === 'home') root.innerHTML = this.renderHome();
            else if (this.state.view === 'setup') root.innerHTML = this.renderSetup();
            else if (this.state.view === 'tracker') root.innerHTML = this.renderTracker();
            else if (this.state.view === 'stats') root.innerHTML = this.renderStats();
            else if (this.state.view === 'history') root.innerHTML = this.renderHistory();
            root.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll]) el.scrollTop = scrolls[el.dataset.scroll]; });
            this.afterRenderScroll();
        },

        // En pantallas angostas: al elegir fundamento baja al panel de resultado; al registrar, vuelve a las jugadoras
        afterRenderScroll() {
            const what = this._scrollTo; this._scrollTo = null;
            if (!what || window.innerWidth >= 1024 || this.state.view !== 'tracker') return;
            const box = document.querySelector('[data-scroll="tracker"]');
            if (!box) return;
            if (what === 'top') { box.scrollTop = 0; return; }
            const panel = document.getElementById('result-panel');
            if (!panel) return;
            const pr = panel.getBoundingClientRect(), br = box.getBoundingClientRect();
            if (pr.bottom > br.bottom) box.scrollTop += Math.min(pr.bottom - br.bottom + 12, pr.top - br.top - 8);
        }
    };

    window.onload = () => app.init();
</script>
</body>
</html>
</body></html>
