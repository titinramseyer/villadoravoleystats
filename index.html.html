<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

tailwind.config={theme:{extend:{colors:{paper:'var(--paper)',mist:'var(--mist)',ink:'var(--ink)',muted:'var(--muted)',line:'var(--line)',navy:'var(--navy)',side:'var(--side)',crimson:'var(--crimson)',court:'var(--court)'},fontFamily:{display:['"Barlow Condensed"','Arial Narrow','sans-serif'],sans:['"IBM Plex Sans"','system-ui','sans-serif']}}}}

<style>
:root{--paper:#fff;--mist:#F1F3F6;--ink:#142041;--muted:#5B667A;--line:#DCE1EA;--navy:#0B1F4B;--side:#0B1F4B;--crimson:#C8102E;--court:#E8ECF4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141C30;--mist:#0D1424;--ink:#E8ECF4;--muted:#9AA6BD;--line:#26324F;--navy:#2F55B8;--side:#08142F;--crimson:#E5384F;--court:#1C2745}}
:root[data-theme="dark"]{--paper:#141C30;--mist:#0D1424;--ink:#E8ECF4;--muted:#9AA6BD;--line:#26324F;--navy:#2F55B8;--side:#08142F;--crimson:#E5384F;--court:#1C2745}

/* ---- App de partidos (Villa Dora Voley): estilos solo mientras está abierta ---- */
body.mode-tracker{font-family:'Inter',sans-serif;background-color:#0f172a;color:#f8fafc;overscroll-behavior-y:none;user-select:none;-webkit-user-select:none;overflow:hidden;height:100vh;height:100dvh}

<body class="font-sans">
<div id="root"><p id="sv-boot" style="padding:24px;font:15px system-ui,sans-serif">Cargando Scouting Vóley…</p></div>
<script>
/* Si algo falla al abrir la app, se muestra el error y la opción de borrar los scouts guardados en este navegador */
window.svReset=function(){try{Object.keys(localStorage).forEach(function(k){if(k==='sv_files'||k.indexOf('sv_raw_')===0)localStorage.removeItem(k)})}catch(e){}location.reload()};
window.svFail=function(msg){var r=document.getElementById('root');if(!r||r.getAttribute('data-ok'))return;r.innerHTML='<div style="max-width:640px;margin:40px auto;padding:24px;font:15px system-ui,sans-serif;background:#fff;color:#142041;border:1px solid #DCE1EA;border-radius:12px"><h1 style="margin:0 0 8px;font-size:22px">La app no pudo abrirse</h1><p style="margin:0 0 12px;color:#5B667A">Error: <code id="sv-err"></code></p><p style="margin:0 0 16px;color:#5B667A">Si pasa después de cargar scouts, borra los scouts guardados en este navegador y vuelve a subirlos. No se borran los archivos de tu computadora.</p><button onclick="svReset()" style="background:#C8102E;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer">Borrar scouts guardados y reiniciar</button></div>';document.getElementById('sv-err').textContent=String(msg||'desconocido').slice(0,400)};
window.addEventListener('error',function(e){svFail(e.message||(e.target&&e.target.src?'no se pudo descargar '+e.target.src:''))},true);
setTimeout(function(){var b=document.getElementById('sv-boot');if(b)svFail('la app tardó más de 25 segundos en arrancar (revisa la conexión a internet)')},25000);
</script>
<div id="app" class="w-full flex flex-col relative" hidden></div>
<script>
    const app = {
        state: {
            view: 'home', // home, setup, tracker, stats, history
            currentMatch: null,
            t_team: 'local', 
            t_player: null,
            t_fundamental: null,
            t_zoneFrom: null,
            t_zoneTo: null,
            winDismissed: false,
            matches: [],
            filters: { category: 'all', branch: 'all', letter: 'all' },
            sessionUser: null,
            storageFull: false,
            cloud: { status: 'connecting', canWrite: true },
        },

        // ================= ACCESO =================
        // Usuarios habilitados. La contraseña no se guarda en texto: se guarda su huella SHA-256
        // de "ratavoley|usuario|contraseña". Para agregar o cambiar usuarios, pedile a Claude el hash nuevo.
        USERS: [
            { user: 'cavd', hash: '49c78aadb2e38aa8add025ea6ebbaa97eb13647a327edd82bcd062abcb51c9f7' },
        ],
        SESSION_KEY: 'ratavoley_session_v1',

        async sha256(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        },

        // viewOnly: alguien de la app de estadísticas mira los partidos sin poder cargar ni borrar
        viewOnly: false,
        isLogged() {
            if (this.viewOnly) return true;
            try {
                const u = localStorage.getItem(this.SESSION_KEY);
                return !!u && this.USERS.some(x => x.user === u);
            } catch (e) { return !!this.state.sessionUser; }
        },

        async login(ev) {
            if (ev) ev.preventDefault();
            const user = (document.getElementById('login-user').value || '').trim().toLowerCase();
            const pass = document.getElementById('login-pass').value || '';
            const errEl = document.getElementById('login-error');
            let ok = false;
            try {
                const h = await this.sha256('ratavoley|' + user + '|' + pass);
                ok = this.USERS.some(x => x.user === user && x.hash === h);
            } catch (e) {
                errEl.textContent = 'Este navegador no permite verificar la contraseña. Abrí la página desde su link https.';
                return;
            }
            if (!ok) {
                errEl.textContent = 'Usuario o contraseña incorrectos.';
                document.getElementById('login-pass').value = '';
                return;
            }
            this.state.sessionUser = user;
            try { localStorage.setItem(this.SESSION_KEY, user); } catch (e) {}
            this.state.view = 'home';
            this.render();
        },

        logout() {
            if (this.viewOnly) { window.svLeaveTracker(false); return; }
            this.state.sessionUser = null;
            try { localStorage.removeItem(this.SESSION_KEY); } catch (e) {}
            this.state.view = 'home';
            window.svLeaveTracker(true);
        },

        renderLogin() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-900">
                    <form onsubmit="app.login(event)" class="w-full max-w-sm bg-slate-800/60 border border-slate-700 rounded-3xl p-8 shadow-2xl">
                        <h1 class="text-3xl sm:text-4xl font-black text-white mb-1 tracking-tight text-center">Villa Dora <span class="text-blue-500">Voley</span></h1>
                        <p class="text-xs text-slate-500 mb-8 font-bold uppercase tracking-widest text-center">Por Agustin Ramseyer</p>
                        <label class="block text-xs text-slate-400 mb-1.5 font-bold uppercase" for="login-user">Usuario</label>
                        <input id="login-user" type="text" autocomplete="username" autocapitalize="none" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white mb-4 outline-none focus:ring-2 focus:ring-blue-500">
                        <label class="block text-xs text-slate-400 mb-1.5 font-bold uppercase" for="login-pass">Contraseña</label>
                        <input id="login-pass" type="password" autocomplete="current-password" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white mb-2 outline-none focus:ring-2 focus:ring-blue-500">
                        <p id="login-error" class="text-red-400 text-sm font-semibold min-h-[1.5rem] mb-2"></p>
                        <button type="submit" class="btn-press w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl text-lg shadow-lg shadow-blue-600/30">Ingresar</button>
                    </form>
                </div>
            `;
        },

        // ================= CATEGORÍAS =================
        CATEGORIES: ['Primera', 'S21', 'S18', 'S16', 'S14', 'S13', 'S12'],
        BRANCHES: [{ v: 'Fem', l: 'Femenino' }, { v: 'Masc', l: 'Masculino' }],
        LETTERS: ['', 'A', 'B', 'C', 'D', 'E'],

        teamLabel(m) {
            if (!m) return '';
            return [m.category || '', m.teamLetter || ''].join(' ').trim() + (m.branch ? ' · ' + m.branch : '');
        },

        teamKey(m) {
            return [m.category || '', m.teamLetter || '', m.branch || ''].join('|');
        },

        // ================= PERSISTENCIA (varios partidos, en este navegador) =================
        STORAGE_KEY: 'ratavoley_data_v2',
        OLD_KEY: 'ratavoley_match_v1',
        _seq: 0,

        // Guarda en el dispositivo y marca el partido abierto para subirlo a la nube
        save() {
            if (this.viewOnly) return;
            this.saveLocal();
            this.markDirty(this.state.currentMatch);
        },

        saveLocal() {
            try {
                const data = {
                    matches: this.state.matches,
                    currentId: this.state.currentMatch ? this.state.currentMatch.id : null,
                    filters: this.state.filters,
                };
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(data));
                this.state.storageFull = false;
            } catch (e) {
                if (!this.state.storageFull) {
                    this.state.storageFull = true;
                    this.showDialog({ title: 'Memoria llena', message: 'No se pudo guardar en este dispositivo: la memoria del navegador está llena. Borrá partidos viejos desde el Historial.', onlyOk: true });
                }
            }
        },

        load() {
            try {
                const raw = localStorage.getItem(this.STORAGE_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    this.state.matches = Array.isArray(d.matches) ? d.matches.filter(m => m && Array.isArray(m.players) && Array.isArray(m.actions)) : [];
                    if (d.filters) this.state.filters = Object.assign(this.state.filters, d.filters);
                    this.state.filters.letter = 'all';
                    this.state.currentMatch = this.state.matches.find(m => m.id === d.currentId) || null;
                } else {
                    // Migración: partido guardado con la versión anterior
                    const old = localStorage.getItem(this.OLD_KEY);
                    if (old) {
                        const m = JSON.parse(old);
                        if (m && Array.isArray(m.players) && Array.isArray(m.actions)) {
                            m.branch = m.branch || 'Fem';
                            m.teamLetter = m.teamLetter || '';
                            if (!this.CATEGORIES.includes(m.category)) m.category = 'Primera';
                            this.state.matches = [m];
                            this.state.currentMatch = m;
                            this.save();
                        }
                        localStorage.removeItem(this.OLD_KEY);
                    }
                }
            } catch (e) { /* dato corrupto o almacenamiento bloqueado */ }
        },

        // ================= VENTANA DE CONFIRMACIÓN PROPIA =================
        // Las ventanas del navegador (confirm/alert) pueden estar bloqueadas dentro de la página publicada.
        showDialog({ title, message, confirmText = 'Aceptar', cancelText = 'Cancelar', danger = false, onConfirm = null, onlyOk = false }) {
            this.closeDialog();
            const wrap = document.createElement('div');
            wrap.id = 'app-dialog';
            wrap.className = 'fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-black/70';
            wrap.innerHTML = `
                <div role="dialog" aria-modal="true" class="w-full max-w-md bg-slate-800 border border-slate-600 rounded-3xl p-6 shadow-2xl">
                    <h3 data-title class="text-xl font-black text-white mb-2"></h3>
                    <p data-msg class="text-slate-300 text-sm font-semibold leading-relaxed mb-6"></p>
                    <div class="flex gap-3 justify-end">
                        ${onlyOk ? '' : '<button data-cancel class="btn-press flex-1 sm:flex-none px-5 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold"></button>'}
                        <button data-ok class="btn-press flex-1 sm:flex-none px-5 py-3 rounded-xl ${danger ? 'bg-red-600 hover:bg-red-500' : 'bg-blue-600 hover:bg-blue-500'} text-white font-bold"></button>
                    </div>
                </div>`;
            wrap.querySelector('[data-title]').textContent = title || '';
            wrap.querySelector('[data-msg]').textContent = message || '';
            const ok = wrap.querySelector('[data-ok]'); ok.textContent = confirmText;
            const cancel = wrap.querySelector('[data-cancel]');
            if (cancel) { cancel.textContent = cancelText; cancel.onclick = () => this.closeDialog(); }
            ok.onclick = () => { this.closeDialog(); if (onConfirm) onConfirm(); };
            wrap.addEventListener('click', e => { if (e.target === wrap) this.closeDialog(); });
            document.body.appendChild(wrap);
            ok.focus();
        },

        closeDialog() {
            const d = document.getElementById('app-dialog');
            if (d) d.remove();
        },

        // Escapa texto para insertarlo seguro en el HTML (nombres con comillas, <, etc.)
        esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        },

        newId() {
            this._seq = (this._seq + 1) % 1000;
            return Date.now() * 1000 + this._seq;
        },

        init() {
            this.load();
            this.render();
            this.initCloud();
            // Si llega un cambio de otro dispositivo mientras se escribe en un campo, se redibuja al salir del campo
            document.addEventListener('focusout', () => {
                if (this._deferRender) setTimeout(() => { if (!this.isTyping()) { this._deferRender = false; this.render(); } }, 0);
            });
        },

        // ================= NUBE (base de datos compartida de la página) =================
        // Cada partido es un documento en "matches/<id>". Si la nube no está disponible
        // (página abierta fuera de Claude, sin sesión, etc.) la app sigue con el guardado local.
        db: null,
        pending: new Set(),     // partidos con cambios sin subir
        deleted: new Set(),     // partidos borrados por subir
        lastSent: new Map(),    // id -> JSON de lo último subido (para no reescribir lo mismo)
        SYNCED_KEY: 'ratavoley_synced_ids_v1',   // partidos que este dispositivo vio o subió a la nube

        loadSynced() {
            if (this._synced) return this._synced;
            let arr = [];
            try { arr = JSON.parse(localStorage.getItem(this.SYNCED_KEY) || '[]'); } catch (e) {}
            this._synced = new Set(Array.isArray(arr) ? arr : []);
            return this._synced;
        },

        saveSynced() {
            try { localStorage.setItem(this.SYNCED_KEY, JSON.stringify([...this.loadSynced()])); } catch (e) {}
        },

        cloudStatus() { return this.state.cloud.status; },
        canWrite() { return !this.viewOnly && this.state.cloud.canWrite; },

        isTyping() {
            const a = document.activeElement;
            return !!a && document.getElementById('app').contains(a) && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA');
        },

        async initCloud() {
            if (!window.claude || typeof window.claude.use !== 'function') { this.setCloud('local'); return; }
            this.setCloud('connecting');
            let db = null;
            try { db = await window.claude.use('db'); } catch (e) { db = null; }
            if (!db) { this.setCloud('local'); return; }
            this.db = db;
            let canWrite = true;
            try {
                const user = await window.claude.use('user');
                if (user) { const c = await user.can('data.write'); if (c === false) canWrite = false; }
            } catch (e) { /* sin datos: se decide con la primera escritura */ }
            this.state.cloud.canWrite = canWrite;
            this.setCloud(canWrite ? 'online' : 'readonly');
            this.unsub = db.collection('matches').onSnapshot(
                snap => this.onCloudSnapshot(snap),
                err => { this.setCloud(err && err.code === 'revoked' ? 'local' : 'error'); }
            );
        },

        setCloud(status) {
            this.state.cloud.status = status;
            const el = document.getElementById('cloud-status');
            if (el) el.outerHTML = this.renderCloudBadge();
            if (this.state.view === 'home' && document.getElementById('app') && !this.isTyping()) {
                const w = document.getElementById('cloud-warning');
                const html = this.renderCloudWarning();
                if (w && !html) w.remove();
                else if (!w && html) this.render();
            }
        },

        renderCloudBadge() {
            const st = this.state.cloud.status;
            const saving = this.pending.size || this._flushing;
            const map = {
                local:      ['Guardado solo en este dispositivo', 'Local', 'bg-slate-700/60 text-slate-300 border-slate-600'],
                connecting: ['Conectando…', '…', 'bg-slate-700/60 text-slate-300 border-slate-600'],
                online:     [saving ? 'Guardando…' : 'Sincronizado', saving ? 'Guardando' : 'En la nube', 'bg-emerald-600/20 text-emerald-300 border-emerald-600/40'],
                readonly:   ['Solo lectura · en vivo', 'Lectura', 'bg-sky-600/20 text-sky-300 border-sky-600/40'],
                error:      ['Sin conexión · se guarda local', 'Sin conexión', 'bg-amber-600/20 text-amber-300 border-amber-600/40'],
            };
            const [txt, short, cls] = map[st] || map.local;
            return `<span id="cloud-status" title="${txt}" class="text-[10px] sm:text-xs font-bold px-2 py-1 rounded-lg border whitespace-nowrap ${cls}"><span class="hidden sm:inline">${txt}</span><span class="sm:hidden">${short}</span></span>`;
        },

        renderCloudWarning() {
            const st = this.state.cloud.status;
            if (st === 'local') return `
                <div id="cloud-warning" class="mb-4 p-4 rounded-2xl border border-amber-500/50 bg-amber-500/10 text-amber-200 text-sm font-semibold leading-relaxed">
                    <b class="block text-amber-300 mb-1">Este dispositivo no está conectado a la nube</b>
                    Lo que cargues acá queda guardado solo en este dispositivo y no aparece en los demás.
                    Abrí Villa Dora Voley desde el link de Claude, con tu cuenta iniciada (no desde un archivo descargado ni desde otra página).
                    Cuando lo abras así, los partidos de este dispositivo se suben solos.
                </div>`;
            if (st === 'error') return `
                <div id="cloud-warning" class="mb-4 p-4 rounded-2xl border border-amber-500/50 bg-amber-500/10 text-amber-200 text-sm font-semibold leading-relaxed">
                    <b class="block text-amber-300 mb-1">Sin conexión con la nube</b>
                    Se sigue guardando en este dispositivo y se sube solo cuando vuelva la conexión.
                </div>`;
            return '';
        },

        onCloudSnapshot(snap) {
            const remote = new Map();
            snap.docs.forEach(d => { const data = d.data(); if (data && Array.isArray(data.actions) && Array.isArray(data.players)) remote.set(d.id, data); });

            const synced = this.loadSynced();
            remote.forEach((_, id) => synced.add(id));

            const busy = id => this.pending.has(id) || (this._writing && this._writing.has(id));
            const next = [];
            const seen = new Set();
            remote.forEach((data, id) => {
                if (this.deleted.has(id)) return;
                seen.add(id);
                const local = this.state.matches.find(m => m.id === id);
                if (local && busy(id)) { next.push(local); return; }
                const json = JSON.stringify(data);
                if (local && JSON.stringify(local) === json) { next.push(local); return; }
                const copy = JSON.parse(json);
                this.lastSent.set(id, json);
                next.push(copy);
            });
            // Partidos de este dispositivo que no están en la nube:
            //  - si alguna vez estuvieron, otro dispositivo los borró → se quitan
            //  - si nunca llegaron (cargados sin conexión), se conservan y se suben
            this.state.matches.forEach(m => {
                if (seen.has(m.id)) return;
                if (busy(m.id)) { next.push(m); return; }
                if (synced.has(m.id)) return;
                next.push(m);
                if (this.canWrite()) this.pending.add(m.id);
            });
            this.saveSynced();

            const curId = this.state.currentMatch && this.state.currentMatch.id;
            this.state.matches = next;
            this.state.currentMatch = curId ? (next.find(m => m.id === curId) || null) : null;
            if (!this.state.currentMatch && this.state.view !== 'home') this.state.view = 'home';

            this.saveLocal();
            if (this.pending.size) this.scheduleFlush();
            if (this.isTyping()) { this._deferRender = true; return; }
            this.render();
        },

        markDirty(m) {
            if (!m || !this.db || !this.canWrite()) return;
            this.pending.add(m.id);
            this.scheduleFlush();
        },

        scheduleFlush(delay = 700) {
            clearTimeout(this._flushTimer);
            this._flushTimer = setTimeout(() => this.flush(), delay);
        },

        // Sube los cambios de a uno por documento (nunca dos escrituras a la vez sobre el mismo partido)
        async flush() {
            if (!this.db || !this.canWrite()) return;
            if (this._flushing) { this._flushAgain = true; return; }
            this._flushing = true;
            this._writing = new Set();
            this.setCloud(this.state.cloud.status === 'error' ? 'online' : this.state.cloud.status);
            try {
                while (this.pending.size) {
                    const ids = [...this.pending];
                    this.pending.clear();
                    ids.forEach(id => this._writing.add(id));   // protegidos hasta terminar de subirse
                    for (const id of ids) {
                        try {
                            const ref = this.db.collection('matches').doc(id);
                            if (this.deleted.has(id)) {
                                await ref.delete();
                                this.deleted.delete(id);
                                this.lastSent.delete(id);
                            } else {
                                const m = this.state.matches.find(x => x.id === id);
                                if (m) {
                                    const json = JSON.stringify(m);
                                    if (this.lastSent.get(id) !== json) {
                                        await ref.set(JSON.parse(json));
                                        this.lastSent.set(id, json);
                                        this.loadSynced().add(id); this.saveSynced();
                                    }
                                }
                            }
                        } catch (e) {
                            const code = e && e.code;
                            if (code === 'invalid_argument') {
                                // Esta persona no tiene permiso para escribir: queda en solo lectura
                                this.state.cloud.canWrite = false;
                                this.pending.clear();
                                this.setCloud('readonly');
                                this.render();
                                return;
                            }
                            if (code === 'quota_exceeded') {
                                this.showDialog({ title: 'Nube llena', message: 'La base de datos compartida está llena. Borrá partidos viejos para seguir guardando en la nube.', onlyOk: true });
                            } else {
                                ids.slice(ids.indexOf(id)).forEach(x => this.pending.add(x));   // reintenta este y los que faltaban
                                this.setCloud('error');
                                this.scheduleFlush(4000 + Math.random() * 2000);
                                return;
                            }
                        } finally {
                            this._writing.delete(id);
                        }
                    }
                }
                this.setCloud('online');
            } finally {
                this._writing.clear();
                this._flushing = false;
                if (this._flushAgain) { this._flushAgain = false; this.scheduleFlush(100); }
            }
        },

        changeView(view) {
            this.state.view = view;
            this.render();
        },

        // Partido para "Continuar": el abierto si sigue en juego; si no, el último empezado sin terminar
        resumeCandidate() {
            const live = m => m && m.started && !this.calculateScore(m).matchOver;
            if (live(this.state.currentMatch)) return this.state.currentMatch;
            return this.state.matches.filter(live)
                .sort((a, b) => ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')))[0] || null;
        },

        resumeMatch() {
            const m = this.resumeCandidate();
            if (!m) return;
            this.openMatch(m.id);
        },

        openMatch(id) {
            const m = this.state.matches.find(x => x.id === id);
            if (!m) return;
            this.state.currentMatch = m;
            this.resetTrackerState();
            const over = this.calculateScore(m).matchOver;
            this.state.winDismissed = over;
            if (!this.canWrite()) { this.state.winDismissed = true; this.changeView('stats'); return; }
            this.changeView(over ? 'stats' : (m.started ? 'tracker' : 'setup'));
        },

        deleteMatch(id) {
            if (!this.canWrite()) return;
            const m = this.state.matches.find(x => x.id === id);
            if (!m) return;
            this.showDialog({
                title: 'Borrar partido',
                message: `${m.localClub} vs ${m.visitorClub} (${this.formatDate(m.date)}). Se borra en todos los dispositivos y no se puede deshacer.`,
                confirmText: 'Borrar', danger: true,
                onConfirm: () => this.doDeleteMatch(id),
            });
        },

        doDeleteMatch(id) {
            if (!this.canWrite()) return;
            this.state.matches = this.state.matches.filter(x => x.id !== id);
            if (this.state.currentMatch && this.state.currentMatch.id === id) this.state.currentMatch = null;
            if (this.db && this.canWrite()) { this.deleted.add(id); this.pending.add(id); this.scheduleFlush(100); }
            this.render();
        },

        setFilter(field, value) {
            this.state.filters[field] = value;
            this.render();
        },

        formatDate(d) {
            if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return d || '';
            const [y, mo, da] = d.split('-');
            return `${da}/${mo}/${y}`;
        },

        renderHome() {
            const cur = this.resumeCandidate();
            const rw = this.canWrite();
            const f = this.state.filters;
            const all = this.state.matches.slice().sort((a, b) => ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')));

            const opt = (field, value, label) => `<option value="${value}" ${f[field] === value ? 'selected' : ''}>${label}</option>`;
            const catSelect = `<select onchange="app.setFilter('category', this.value)" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-white font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">${opt('category', 'all', 'Todas')}${this.CATEGORIES.map(c => opt('category', c, c)).join('')}</select>`;
            const branchSelect = `<select onchange="app.setFilter('branch', this.value)" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-white font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">${opt('branch', 'all', 'Ambas')}${this.BRANCHES.map(b => opt('branch', b.v, b.l)).join('')}</select>`;

            const list = all.filter(m =>
                (f.category === 'all' || m.category === f.category) &&
                (f.branch === 'all' || m.branch === f.branch) &&
                (f.letter === 'all' || (f.letter === 'none' ? !m.teamLetter : m.teamLetter === f.letter))
            );

            const cards = list.map(m => {
                const sc = this.calculateScore(m);
                let status, statusCls;
                if (sc.matchOver) {
                    const won = sc.localSets > sc.visitorSets;
                    status = won ? 'Ganado' : 'Perdido';
                    statusCls = won ? 'bg-green-600/20 text-green-400 border-green-600/40' : 'bg-red-600/20 text-red-400 border-red-600/40';
                } else if (m.started) {
                    status = 'En juego'; statusCls = 'bg-yellow-500/20 text-yellow-400 border-yellow-500/40';
                } else {
                    status = 'Sin empezar'; statusCls = 'bg-slate-700/50 text-slate-400 border-slate-600';
                }
                const sets = sc.sets.map(s => `${s.local}-${s.visitor}`).join(' · ') + (!sc.matchOver && m.started && (sc.local || sc.visitor) ? (sc.sets.length ? ' · ' : '') + `(${sc.local}-${sc.visitor})` : '');
                return `
                    <div class="bg-slate-800/70 border border-slate-700/60 rounded-2xl p-3 sm:p-4 flex flex-wrap sm:flex-nowrap items-center gap-3 sm:gap-4">
                        <div class="w-20 sm:w-24 shrink-0 text-center">
                            <div class="text-2xl sm:text-3xl font-black text-white">${sc.localSets}-${sc.visitorSets}</div>
                            <span class="inline-block mt-1 text-[10px] font-black uppercase px-2 py-0.5 rounded border ${statusCls}">${status}</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                <span class="text-[11px] font-black bg-blue-600/20 text-blue-300 border border-blue-500/30 px-2 py-0.5 rounded">${this.esc(this.teamLabel(m))}</span>
                                <span class="text-xs text-slate-400 font-semibold">${this.formatDate(m.date)}${m.time ? ' · ' + this.esc(m.time) : ''}</span>
                                <span class="text-xs text-slate-500 truncate">${this.esc(m.tournament)}</span>
                            </div>
                            <div class="font-black text-white truncate"><span class="text-blue-400">${this.esc(m.localClub)}</span> <span class="text-slate-500 font-semibold">vs</span> <span class="text-red-400">${this.esc(m.visitorClub)}</span></div>
                            <div class="text-xs text-slate-400 font-semibold mt-0.5">${sets || 'Sin puntos cargados'}</div>
                        </div>
                        <div class="flex gap-2 shrink-0 w-full sm:w-auto">
                            <button onclick="app.openMatch('${this.esc(m.id)}')" class="btn-press flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm px-4 py-2.5 rounded-xl whitespace-nowrap">${sc.matchOver || !rw ? (m.started && !sc.matchOver ? 'Ver en vivo' : 'Ver stats') : 'Abrir'}</button>
                            ${rw ? `<button onclick="app.deleteMatch('${this.esc(m.id)}')" title="Borrar partido" class="btn-press bg-slate-900/60 hover:bg-red-600 text-slate-400 hover:text-white px-3 py-2.5 rounded-xl border border-slate-700">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>` : ''}
                        </div>
                    </div>`;
            }).join('');

            const emptyMsg = all.length === 0
                ? 'Todavía no hay partidos guardados. Empezá uno nuevo.'
                : 'No hay partidos con estos filtros.';

            const resumeHtml = cur ? `
                <button onclick="app.resumeMatch()" class="btn-press w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 px-6 rounded-2xl text-lg shadow-xl shadow-green-600/30 flex flex-col items-center">
                    <span>${rw ? 'Continuar partido' : 'Ver partido en vivo'}</span>
                    <span class="text-xs font-semibold opacity-90 mt-1 truncate max-w-full">${this.esc(cur.localClub)} vs ${this.esc(cur.visitorClub)} · ${this.esc(this.teamLabel(cur))}</span>
                </button>` : '';

            return `
                <div class="h-full flex flex-col bg-slate-900">
                    <div class="bg-slate-800/90 border-b border-slate-700 py-3 px-3 lg:px-6 flex justify-between items-center gap-2 shrink-0">
                        <div class="text-lg sm:text-2xl font-black text-white tracking-tight whitespace-nowrap">Villa Dora <span class="text-blue-500">Voley</span> <span class="hidden md:inline text-[10px] text-slate-500 font-bold uppercase tracking-widest ml-2">Por Agustin Ramseyer</span></div>
                        <div class="flex items-center gap-2 sm:gap-3">
                            ${this.renderCloudBadge()}
                            <span class="hidden sm:inline text-xs text-slate-400 font-semibold">${this.esc(this.state.sessionUser || (function(){ try { return localStorage.getItem(app.SESSION_KEY) || ''; } catch(e) { return ''; } })())}</span>
                            <button onclick="app.logout()" class="btn-press text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg font-semibold whitespace-nowrap">${this.viewOnly ? '← Volver' : 'Salir'}</button>
                        </div>
                    </div>
                    <div data-scroll="home" class="flex-1 min-h-0 flex flex-col lg:flex-row gap-3 lg:gap-5 p-3 lg:p-5 overflow-y-auto lg:overflow-hidden">
                        <div class="w-full lg:w-72 shrink-0 flex flex-col sm:flex-row lg:flex-col gap-3">
                            ${resumeHtml}
                            ${rw ? `<button onclick="app.startSetup()" class="btn-press w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-2xl text-lg shadow-xl shadow-blue-600/30">Nuevo partido</button>` : ''}
                            <div class="hidden lg:block mt-2 text-xs text-slate-500 font-semibold leading-relaxed">${all.length} partido${all.length === 1 ? '' : 's'} ${this.db ? 'en la nube.' : (all.length === 1 ? 'guardado en este dispositivo.' : 'guardados en este dispositivo.')}${rw ? '' : ' Estás en modo lectura: ves los partidos en vivo pero no podés cargar ni borrar.'}</div>
                        </div>
                        <div class="lg:flex-1 min-w-0 flex flex-col bg-slate-800/40 border border-slate-700/80 rounded-3xl p-3 sm:p-5 lg:min-h-0">
                            ${this.renderCloudWarning()}
                            <h2 class="text-base sm:text-lg font-black text-white uppercase tracking-widest mb-3 sm:mb-4">Historial de partidos</h2>
                            <div class="space-y-2 mb-4 shrink-0">
                                <div class="grid grid-cols-2 gap-3 sm:max-w-md">
                                    <label class="block"><span class="block text-[10px] text-slate-500 font-black uppercase tracking-widest mb-1">Categoría</span>${catSelect}</label>
                                    <label class="block"><span class="block text-[10px] text-slate-500 font-black uppercase tracking-widest mb-1">Rama</span>${branchSelect}</label>
                                </div>
                            </div>
                            <div data-scroll="home-list" class="lg:flex-1 lg:overflow-y-auto lg:pr-2 space-y-3">
                                ${cards || `<div class="text-center text-slate-500 font-bold py-16">${emptyMsg}</div>`}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        },

        startSetup() {
            if (!this.canWrite()) return;
            this.state.winDismissed = false;
            const now = new Date();
            const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            const defaultPlayers = this.defaultPlayers();

            // Arranca con la categoría/rama/equipo que esté filtrada en el historial (si hay una elegida)
            const f = this.state.filters;
            const m = {
                id: Date.now().toString(),
                tournament: 'Torneo Oficial',
                localClub: 'Mi Equipo',
                visitorClub: 'Visitante',
                category: f.category !== 'all' ? f.category : 'Primera',
                branch: f.branch !== 'all' ? f.branch : 'Fem',
                teamLetter: (f.letter !== 'all' && f.letter !== 'none') ? f.letter : '',
                date: dateStr,
                time: timeStr,
                matchType: 'bestOf5',
                started: false,
                players: defaultPlayers,
                actions: []
            };
            const prev = this.lastMatchOfTeam(m);
            if (prev) { m.players = JSON.parse(JSON.stringify(prev.players)); m.localClub = prev.localClub; m.rosterFrom = prev.id; }
            this.state.matches.push(m);
            this.state.currentMatch = m;
            this.changeView('setup');
        },

        defaultPlayers() {
            const posArr = ['Armador', 'Punta', 'Central', 'Opuesto', 'Libero'];
            return Array.from({length: 14}, (_, i) => ({ id: i+1, number: i+1, name: `Jugadora ${i+1}`, position: posArr[i % 5] }));
        },

        cancelSetup() {
            const m = this.state.currentMatch;
            if (m && !m.started && m.actions.length === 0) {
                this.state.matches = this.state.matches.filter(x => x.id !== m.id);
                this.state.currentMatch = null;
            }
            this.changeView('home');
        },

        // Último partido (distinto del actual) del mismo equipo: categoría + letra + rama
        lastMatchOfTeam(m) {
            const key = this.teamKey(m);
            return this.state.matches
                .filter(x => x.id !== m.id && this.teamKey(x) === key && x.players && x.players.length)
                .sort((a, b) => ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')))[0] || null;
        },

        // Cambio de categoría / rama / letra: si todavía no hay acciones, trae el plantel de ese equipo
        updateTeamField(field, value) {
            if (!this.canWrite()) return;
            const m = this.state.currentMatch;
            m[field] = value;
            if (m.actions.length === 0) {
                const prev = this.lastMatchOfTeam(m);
                if (prev) { m.players = JSON.parse(JSON.stringify(prev.players)); m.localClub = prev.localClub; m.rosterFrom = prev.id; }
                else if (m.rosterFrom) {
                    // El plantel era de otro equipo: vuelve al plantel genérico
                    m.players = this.defaultPlayers(); m.localClub = 'Mi Equipo'; m.rosterFrom = null;
                }
            }
            this.render();
        },

        updateMatchField(field, value) {
            if (!this.canWrite()) return;
            // Sin redibujar: así el toque siguiente (otro campo o "A la Cancha") no se pierde
            this.state.currentMatch[field] = value;
            this.save();
        },

        updatePlayer(id, field, value) {
            if (!this.canWrite()) return;
            const player = this.state.currentMatch.players.find(p => p.id === id);
            if (!player) return;
            if (field === 'number') {
                const n = parseInt(value, 10);
                player.number = Number.isFinite(n) ? n : player.number;
            } else {
                player[field] = value;
            }
            this.save();
        },

        removePlayer(id) {
            if (!this.canWrite()) return;
            const m = this.state.currentMatch;
            const used = m.actions.filter(a => a.playerId === id).length;
            if (used > 0) {
                const p = m.players.find(x => x.id === id);
                this.showDialog({
                    title: 'Borrar jugadora',
                    message: `${p ? p.name : 'Esta jugadora'} tiene ${used} acciones cargadas. Si la borrás, esas acciones quedan sin jugadora en las stats.`,
                    confirmText: 'Borrar igual', danger: true,
                    onConfirm: () => this.doRemovePlayer(id),
                });
                return;
            }
            this.doRemovePlayer(id);
        },

        doRemovePlayer(id) {
            const m = this.state.currentMatch;
            m.players = m.players.filter(p => p.id !== id);
            this.render();
        },

        addPlayer() {
            if (!this.canWrite()) return;
            const maxId = this.state.currentMatch.players.reduce((max, p) => p.id > max ? p.id : max, 0);
            this.state.currentMatch.players.push({ 
                id: maxId + 1, 
                number: maxId + 1, 
                name: 'Nueva',
                position: 'Punta'
            });
            this.render();
        },

        startMatch() {
            if (!this.canWrite()) return;
            if (!this.state.currentMatch.localClub || this.state.currentMatch.localClub.trim() === '') {
                this.state.currentMatch.localClub = 'Local';
            }
            if (!this.state.currentMatch.visitorClub || this.state.currentMatch.visitorClub.trim() === '') {
                this.state.currentMatch.visitorClub = 'Visitante';
            }
            this.state.currentMatch.started = true;
            this.resetTrackerState();
            this.changeView('tracker');
        },

        renderSetup() {
            const m = this.state.currentMatch;
            const posOptions = ['Armador', 'Punta', 'Central', 'Opuesto', 'Libero'];
            
            let playersHtml = m.players.map(p => `
                <div class="flex items-center gap-2 bg-slate-800 p-2 rounded-xl border border-slate-700/60 mb-2">
                    <input type="number" inputmode="numeric" value="${p.number}" onchange="app.updatePlayer(${p.id}, 'number', this.value)" class="w-12 sm:w-14 shrink-0 bg-slate-900 border border-slate-700 rounded-lg p-2 text-center text-white font-bold text-sm" placeholder="#">
                    <input type="text" value="${this.esc(p.name)}" onchange="app.updatePlayer(${p.id}, 'name', this.value)" class="flex-1 min-w-0 bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-sm" placeholder="Nombre">
                    <select onchange="app.updatePlayer(${p.id}, 'position', this.value)" class="w-24 sm:w-28 shrink-0 bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
                        ${posOptions.map(pos => `<option value="${pos}" ${p.position === pos ? 'selected' : ''}>${pos}</option>`).join('')}
                    </select>
                    <button onclick="app.removePlayer(${p.id})" class="shrink-0 bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white p-2 rounded-lg btn-press">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `).join('');

            return `
                <div class="h-full flex flex-col bg-slate-900 select-none">
                    <div class="bg-slate-800/90 backdrop-blur py-3 px-3 lg:px-6 shadow flex flex-wrap gap-2 justify-between items-center border-b border-slate-700 shrink-0">
                        <h2 class="text-base lg:text-lg font-bold flex items-center gap-2 text-white">Configuración <span class="hidden sm:inline text-xs text-slate-400 font-normal">| Villa Dora Voley (Agustin Ramseyer)</span></h2>
                        <div class="flex items-center gap-2 lg:gap-3">
                            <button onclick="app.cancelSetup()" class="px-4 py-2 text-slate-400 hover:text-white font-medium text-sm">${m.started ? 'Inicio' : 'Cancelar'}</button>
                            <button onclick="app.startMatch()" class="btn-press bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 px-4 lg:px-6 rounded-xl shadow-lg text-sm whitespace-nowrap">${m.started ? 'Volver a la Cancha ➔' : 'A la Cancha ➔'}</button>
                        </div>
                    </div>
                    
                    <div data-scroll="setup" class="flex-1 min-h-0 overflow-y-auto lg:overflow-hidden p-3 lg:p-4 flex flex-col lg:flex-row gap-3 lg:gap-4">
                        <!-- Columna Datos Partido -->
                        <div class="w-full lg:w-5/12 shrink-0 lg:shrink bg-slate-800/40 backdrop-blur rounded-2xl p-4 lg:p-5 border border-slate-700/80 flex flex-col lg:overflow-y-auto">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-blue-400 mb-4 pb-2 border-b border-slate-700">Datos del Encuentro</h3>
                            
                            <div class="mb-4 bg-blue-950/30 p-4 rounded-xl border border-blue-800/40">
                                <label class="block text-xs text-blue-300 mb-2 font-bold uppercase">Equipo</label>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <span class="block text-[10px] text-slate-500 mb-1 font-bold uppercase">Categoría</span>
                                        <select onchange="app.updateTeamField('category', this.value)" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                            ${this.CATEGORIES.map(c => `<option value="${c}" ${m.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <span class="block text-[10px] text-slate-500 mb-1 font-bold uppercase">Equipo</span>
                                        <select onchange="app.updateTeamField('teamLetter', this.value)" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                            ${this.LETTERS.map(l => `<option value="${l}" ${(m.teamLetter || '') === l ? 'selected' : ''}>${l || 'Sin letra'}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <span class="block text-[10px] text-slate-500 mb-1 font-bold uppercase">Rama</span>
                                        <select onchange="app.updateTeamField('branch', this.value)" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                            ${this.BRANCHES.map(b => `<option value="${b.v}" ${m.branch === b.v ? 'selected' : ''}>${b.l}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                                ${(() => { const src = m.rosterFrom && this.state.matches.find(x => x.id === m.rosterFrom); return src ? `<p class="text-[11px] text-blue-300/80 font-semibold mt-2">Plantel cargado del último partido de ${this.esc(this.teamLabel(m))} (${this.formatDate(src.date)} vs ${this.esc(src.visitorClub)}).</p>` : ''; })()}
                            </div>

                            <div class="mb-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                                <label class="block text-xs text-slate-400 mb-1.5 font-bold uppercase">Formato del Partido</label>
                                <select onchange="app.updateMatchField('matchType', this.value)" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="bestOf3" ${m.matchType === 'bestOf3' ? 'selected' : ''}>Al Mejor de 3 Sets</option>
                                    <option value="bestOf5" ${m.matchType === 'bestOf5' ? 'selected' : ''}>Al Mejor de 5 Sets</option>
                                </select>
                            </div>

                            <div class="mb-4">

        resetTrackerState() {
            this.state.t_team = 'local';
            this.state.t_player = null;
            this.state.t_fundamental = null;
            this.state.t_zoneFrom = null;
            this.state.t_zoneTo = null;
        },

        setTeam(team) {
            this.state.t_team = team;
            this.state.t_player = null; 
            this.state.t_fundamental = null;
            this.state.t_zoneFrom = null;
            this.state.t_zoneTo = null;
            this.render();
        },

        setPlayer(playerId) {
            this.state.t_player = playerId;
            this.render();
        },

        setFundamental(fund) {
            if (this.state.t_team === 'visitor' && fund === 'recepcion') return; 
            
            this.state.t_fundamental = fund;
            this._scrollTo = 'result';
            this.state.t_zoneFrom = null;
            this.state.t_zoneTo = null;
            
            this.render();
        },

        setZone(type, zone) {
            if (type === 'from') this.state.t_zoneFrom = zone;
            if (type === 'to') this.state.t_zoneTo = zone;
            this.render();
        },

        recordAction(outcome, quality = null) {
            if (!this.canWrite()) return;
            if (this.state.t_team === 'local' && !this.state.t_player) return;
            if (!this.state.t_fundamental) return;
            
            const isRec = this.state.t_fundamental === 'recepcion';

            if (isRec && (!this.state.t_zoneFrom || !this.state.t_zoneTo)) return;
            if (isRec && !quality) return;

            // Partido terminado: no se cargan más acciones (se puede corregir desde Historial o Deshacer)
            if (this.calculateScore().matchOver) {
                this.state.winDismissed = false;
                this.render();
                return;
            }

            const action = {
                id: this.newId(),
                team: this.state.t_team,
                playerId: this.state.t_team === 'local' ? this.state.t_player : null,
                fundamental: this.state.t_fundamental,
                outcome: outcome, // 'punto', 'error', 'sigue'
                quality: quality, // '#', '+', '!', '-', '/', 'error', 'punto'
                zoneFrom: isRec ? this.state.t_zoneFrom : null,
                zoneTo: isRec ? this.state.t_zoneTo : null,
                timestamp: new Date().toISOString()
            };

            this.state.currentMatch.actions.unshift(action);
            this._scrollTo = 'top';
            this.resetTrackerState();
            this.render();
        },

        deleteAction(actionId) {
            if (!this.canWrite()) return;
            this.state.currentMatch.actions = this.state.currentMatch.actions.filter(a => a.id !== actionId);
            this.state.winDismissed = false;
            this.render();
        },

        // Borra la última acción cargada (las acciones se guardan de la más nueva a la más vieja)
        undoLast() {
            if (!this.canWrite()) return;
            const actions = this.state.currentMatch.actions;
            if (actions.length === 0) return;
            actions.shift();
            this.state.winDismissed = false;
            this.resetTrackerState();
            this.render();
        },

        dismissWin() {
            this.state.winDismissed = true;
            this.render();
        },

        describeAction(a) {
            if (!a) return '';
            const m = this.state.currentMatch;
            let who = 'Rival';
            if (a.team === 'local') {
                const p = m.players.find(x => x.id === a.playerId);
                who = p ? '#' + p.number + ' ' + p.name : 'Jugadora eliminada';
            }
            const fund = a.fundamental.replace('_', ' ');
            let res = a.quality ? (a.quality === 'punto' ? 'ACE' : a.quality === 'error' ? 'Error' : a.quality) : (a.outcome === 'punto' ? 'Punto' : 'Error');
            return `${who} · ${fund} · ${res}`;
        },

        calculateScore(match = this.state.currentMatch) {
            if (!match) return { local: 0, visitor: 0, sets: [], localSets: 0, visitorSets: 0, maxSets: 5, setsToWin: 3, countedIds: new Set(), matchOver: false };
            const actions = match.actions.slice().reverse(); 
            
            let local = 0;
            let visitor = 0;
            let sets = [];
            let localSets = 0;
            let visitorSets = 0;
            
            const matchType = match.matchType || 'bestOf5';
            const maxSets = matchType === 'bestOf3' ? 3 : 5;
            const setsToWin = Math.ceil(maxSets / 2);
            const countedIds = new Set();

            for (let i = 0; i < actions.length; i++) {
                const a = actions[i];
                if (localSets === setsToWin || visitorSets === setsToWin) break;
                countedIds.add(a.id);

                let pointFor = null;
                // Si la acción determina un punto a favor
                if (a.outcome === 'punto' || a.quality === 'punto') pointFor = a.team;
                // Si la acción es un error, el punto es del contrario
                if (a.outcome === 'error' || a.quality === 'error') pointFor = a.team === 'local' ? 'visitor' : 'local';

                if (pointFor === 'local') local++;
                if (pointFor === 'visitor') visitor++;

                // Verificación de fin de Set
                const isTieBreak = (sets.length === maxSets - 1);
                const targetScore = isTieBreak ? 15 : 25;

                if ((local >= targetScore || visitor >= targetScore) && Math.abs(local - visitor) >= 2) {
                    sets.push({ local, visitor });
                    if (local > visitor) localSets++;
                    else visitorSets++;
                    local = 0;
                    visitor = 0;
                }
            }
            
            const matchOver = localSets === setsToWin || visitorSets === setsToWin;
            return { local, visitor, sets, localSets, visitorSets, maxSets, setsToWin, countedIds, matchOver };
        },

                     qualityBtnsHtml = `<div class="w-full text-center text-slate-500 font-bold text-xs uppercase py-4">Selecciona Zonas Primero</div>`;

                rightColHtml = `

                                <span class="block text-[10px] text-slate-400 font-black uppercase mb-3 tracking-widest">Viene de</span>

                            <div class="flex gap-1.5 w-full h-full items-stretch">
                                ${qualityBtnsHtml}
                            </div>
                        </div>
                    </div>
                `;
            } else if (this.state.t_fundamental === 'defensa' || this.state.t_fundamental === 'enf') {
                 rightColHtml = `
                    <div class="flex-1 flex flex-col items-center justify-center h-full space-y-4">
                        <span class="text-slate-400 font-black tracking-widest uppercase text-xs">Registrar</span>
                        <button onclick="app.recordAction('error')" class="btn-press w-full h-36 lg:h-3/4 bg-red-600 text-white font-black text-2xl sm:text-4xl rounded-3xl shadow-xl shadow-red-600/20 flex flex-col items-center justify-center gap-3 hover:bg-red-500">

                    </div>
                `;
            } else if (fundamentalSelected) {
                 rightColHtml = `
                    <div class="flex-1 flex flex-col items-center justify-center h-full space-y-4">
                        <span class="text-slate-400 font-black tracking-widest uppercase text-xs">Resultado de la Acción</span>
                        <div class="flex gap-3 sm:gap-4 w-full h-36 lg:h-3/4">
                            <button onclick="app.recordAction('punto')" class="btn-press flex-1 bg-green-600 text-white font-black text-2xl sm:text-4xl rounded-3xl shadow-xl shadow-green-600/20 flex flex-col items-center justify-center gap-2 hover:bg-green-500">
                                <span>PUNTO</span>${isSaque ? '<span class="text-sm font-semibold opacity-80">(Ace)</span>' : ''}
                            </button>
                            <button onclick="app.recordAction('error')" class="btn-press flex-1 bg-red-600 text-white font-black text-2xl sm:text-4xl rounded-3xl shadow-xl shadow-red-600/20 flex flex-col items-center justify-center gap-2 hover:bg-red-500">
                                <span>ERROR</span>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                rightColHtml = '';
            }

            return `
                <div class="h-full flex flex-col bg-slate-900 relative">
                    ${this.renderMatchHeader('tracker')}

                    <div data-scroll="tracker" class="flex-1 min-h-0 flex flex-col lg:flex-row gap-3 lg:gap-4 p-3 lg:p-4 overflow-y-auto lg:overflow-hidden">
                        <!-- Col 1: Equipo y Jugadoras -->
                        <div class="lg:w-[30%] shrink-0 lg:shrink flex flex-col bg-slate-800/40 backdrop-blur rounded-3xl border border-slate-700/80 p-2.5 lg:p-3 shadow-xl lg:min-h-0">
                            <div class="flex bg-slate-900/90 rounded-2xl p-1 lg:p-1.5 mb-2 lg:mb-3 border border-slate-700/50 shrink-0">

                                <button onclick="app.setTeam('visitor')" class="flex-1 py-2.5 lg:py-3 font-black text-xs lg:text-sm uppercase tracking-wider rounded-xl transition-all ${isVisitor ? 'bg-red-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">Visitante</button>
                            </div>
                            <div data-scroll="players" class="lg:flex-1 lg:overflow-y-auto lg:pr-1">
                                <div class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-2 gap-1.5 lg:gap-2">
                                    ${playersHtml}
                                </div>
                            </div>
                        </div>

                        <!-- Col 2: Fundamentos -->
                        <div class="lg:w-[25%] shrink-0 lg:shrink flex flex-col bg-slate-800/40 backdrop-blur rounded-3xl border border-slate-700/80 p-2.5 lg:p-3 shadow-xl">

                            <div class="grid grid-cols-4 lg:flex lg:flex-col gap-1.5 lg:gap-2.5 lg:flex-1 lg:justify-center">
                                ${fundHtml}
                            </div>
                        </div>

                        <!-- Col 3: Resultados -->
                        <div id="result-panel" class="lg:w-[45%] shrink-0 lg:shrink min-h-[230px] lg:min-h-0 flex flex-col bg-slate-800/40 backdrop-blur rounded-3xl border border-slate-700/80 p-3 lg:p-4 shadow-xl relative">
                            ${!playerSelected || !fundamentalSelected ? 
                                `<div class="absolute inset-0 z-10 flex items-center justify-center p-6 text-center bg-slate-900/70 backdrop-blur-sm rounded-3xl border border-slate-700">
                                    <p class="text-slate-300 font-bold text-base lg:text-xl tracking-wide uppercase"><span class="text-blue-400">1.</span> Selecciona Jugadora<br class="hidden lg:block"><span class="lg:hidden"> · </span><br class="hidden lg:block"><span class="text-blue-400">2.</span> Selecciona Fundamento</p>
